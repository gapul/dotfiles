# adb で流す Android の OS 設定 (SSOT)。`apply.sh` が読む。
# 書式: <namespace> <key> <value>   namespace は global / system / secure
#
# 値の意味を調べるとき:
#   adb shell settings list global      # 現在値を全部出す
#   adb shell settings get global window_animation_scale
#
# ここに書けるのは `settings` テーブルに載っている設定だけ。
# トグルの多くは端末ローカルの XML で、adb からは触れない (手で設定する)。

# アニメーションを速く (体感の遅さの大半はこれ)
global window_animation_scale 0.5
global transition_animation_scale 0.5
global animator_duration_scale 0.5

# 物理キーボード接続中もソフトキーボードを出す (Keyball を繋ぐとき用)
secure show_ime_with_hard_keyboard 1

# 充電時に画面を点けたままにしない (常時 ON は焼き付きと発熱の元)
global stay_on_while_plugged_in 0

# Private DNS (NextDNS) は ID が入るのでここには書かない。手で一度だけ:
#   adb shell settings put global private_dns_mode hostname
#   adb shell settings put global private_dns_specifier <id>.dns.nextdns.io

# Material You の元の色を rose-pine の iris に固定する (壁紙から取らない)。色は
# configs/theme/palettes.json の有効なパレットの iris で、test.sh が一致を確かめる。
# Material You はこの 1 色からトーンを機械生成するので、rose-pine そのものの色にはならず
# 「iris 寄りの配色」になる。
secure theme_customization_overlay_packages {"android.theme.customization.color_source":"preset","android.theme.customization.system_palette":"C4A7E7","android.theme.customization.accent_color":"C4A7E7","android.theme.customization.theme_style":"TONAL_SPOT"}
