# KernelSU Next の ksud feature。root.sh が `ksud feature set` と `save` で当てる。
# 書式: <feature> <value>      値は 0 / 1。一覧は `adb shell su -c '/data/adb/ksud feature list'`
#
# 端末に無い feature を書くと root.sh が UNSUPPORTED として報告する。

su_compat 1
kernel_umount 1
selinux_hide 1
avc_spoof 1
sulog 0

# adb を root で上げる。USB デバッグが有効な間は、繋いだ PC に root シェルを渡すことになる。
# root.sh 自体が adb 越しの su を前提にしているので、作業する間は 1 にしておく。
adb_root 1
