# Xiaomi Pad 5 (nabu) の OS 設定。書式は ../../os-settings.conf と同じ。
# アニメーション速度などは端末の既定のままにしている。

# 隠し API の制限を全アプリで外す。JamesDSP (root/ の ainur_jamesdsp) がこれを前提に
# していて、モジュールのインストール時にも同じ値が書かれる。
global hidden_api_policy 1

# Material You の元の色を rose-pine の iris に固定する (壁紙から取らない)。色は
# configs/theme/palettes.json の有効なパレットの iris で、test.sh が一致を確かめる。
# Material You はこの 1 色からトーンを機械生成するので、rose-pine そのものの色にはならず
# 「iris 寄りの配色」になる。
# フォントもこの設定が持つ (起動時に ThemeOverlayController が、ここに無いフォントの
# オーバーレイを外す)。crDroid 同梱の San Francisco で、母艦 (macOS) の UI フォントと同じ系統。
secure theme_customization_overlay_packages {"android.theme.customization.color_source":"preset","android.theme.customization.system_palette":"C4A7E7","android.theme.customization.accent_color":"C4A7E7","android.theme.customization.theme_style":"TONAL_SPOT","android.theme.customization.font":"com.android.theme.font.sanfrancisco"}
