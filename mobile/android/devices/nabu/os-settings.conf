# Xiaomi Pad 5 (nabu) の OS 設定。書式は ../../os-settings.conf と同じ。
# アニメーション速度などは端末の既定のままにしている。

# 隠し API の制限を全アプリで外す。JamesDSP (root/ の ainur_jamesdsp) がこれを前提に
# していて、モジュールのインストール時にも同じ値が書かれる。
global hidden_api_policy 1

# Material You の元の色を rose-pine の iris に固定する (壁紙から取らない)。色は
# configs/theme/palettes.json の有効なパレットの iris で、test.sh が一致を確かめる。
# Material You はこの 1 色からトーンを機械生成するので、rose-pine そのものの色にはならず
# 「iris 寄りの配色」になる。
# フォントもこの設定が持つ (起動時に ThemeOverlayController が、ここに無いフォントの
# オーバーレイを外す)。ROM (AxionAOSP) 同梱の San Francisco で、母艦 (macOS) の UI フォントと同じ系統。
# ロック画面の時計と At a Glance を隠す指定 (hideclock / smartspace) も同じ設定に入る。端末で選んだ値。
# 端末の「壁紙とスタイル」やロック画面の設定もこの値を書き換え、os.sh は丸ごと上書きする。
# 当てる前に --dry-run で差分を見て、端末で選び直したものならここに取り込む。
secure theme_customization_overlay_packages {"android.theme.customization.color_source":"preset","android.theme.customization.system_palette":"C4A7E7","android.theme.customization.accent_color":"C4A7E7","android.theme.customization.theme_style":"TONAL_SPOT","android.theme.customization.font":"com.android.theme.font.sanfrancisco","android.theme.customization.hideclock":"com.android.systemui.clocks.hideclock","android.theme.customization.smartspace":"com.android.systemui.hide.smartspace"}

# 入力方式は Sumire (apps.tsv) だけにして既定にする。AOSP のキーボードは os-debloat.txt で外す
# (os.sh は settings を debloat より先に当てるので、外す時点で既定はもう Sumire になっている)。
secure enabled_input_methods com.kazumaproject.markdownhelperkeyboard/.ime_service.IMEService
secure default_input_method com.kazumaproject.markdownhelperkeyboard/.ime_service.IMEService
# Tailscale を常時接続にする (出口ノード mullvad-exit 経由で外に出る)。VPN が切れたときに
# 通信を止める lockdown は付けない: mullvad-exit が落ちると端末ごと繋がらなくなるため。
secure always_on_vpn_app com.tailscale.ipn
secure always_on_vpn_lockdown 0
# AxSandbox の隔離 (apps.tsv の方針: プロプライエタリなアプリは隔離する)。YouTube、Instagram、
# Infinity を Lock + Isolate (sandboxed_pkgs) にし、ストレージの gid (1015/1023/1077-1079) を外し、
# データを強制分離し、ADB / 開発者向けオプション / ワイヤレスデバッグを偽装する。インターネットの
# gid (3003) は外さない。AxSandbox の画面で変えたらこの値を取り込む。PIN のハッシュと秘密の質問は
# 別の設定 (sandbox_credential_hash など) にあり、4 桁の PIN は総当たりで戻せるのでここに置かない。
secure sandbox_config {"locked_pkgs":["ml.docilealligator.infinityforreddit.patreon","com.google.android.youtube","com.instagram.android"],"hidden_pkgs":[],"sandboxed_pkgs":["ml.docilealligator.infinityforreddit.patreon","com.google.android.youtube","com.instagram.android"],"hidedevopts_pkgs":[],"spoof_settings_map":{"ml.docilealligator.infinityforreddit.patreon":["adb_wifi_enabled","development_settings_enabled","adb_enabled"],"com.google.android.youtube":["adb_wifi_enabled","development_settings_enabled","adb_enabled"],"com.instagram.android":["adb_wifi_enabled","development_settings_enabled","adb_enabled"]},"data_isolation_pkgs":["ml.docilealligator.infinityforreddit.patreon","com.google.android.youtube","com.instagram.android"],"gid_restrictions":{"ml.docilealligator.infinityforreddit.patreon":[1015,1023,1077,1078,1079],"com.google.android.youtube":[1015,1023,1077,1078,1079],"com.instagram.android":[1015,1023,1077,1078,1079]}}
