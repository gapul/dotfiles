# esphome/secrets.yaml の雛形。実物は gitignore していて repo に入れない。
# 検証 (validate.sh) はこの雛形をそのまま使うので、値は本物でなくてよい。
wifi_ssid: "example-ssid"
wifi_password: "example-password"
ap_password: "example-ap-password"
ota_password: "example-ota-password"
# 32 バイトの base64。実物は `esphome wizard` か openssl rand -base64 32 で作る。
api_encryption_key: "TjhZS0FBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQT0="
ntfy_topic: "example-topic"
