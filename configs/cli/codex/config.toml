# 個人の好み (機種非依存)。TOML の仕様上、トップレベルのキーは
# 最初のテーブルヘッダより前に置く必要がある。
model = "gpt-5.5"
model_reasoning_effort = "medium"
personality = "pragmatic"

# yolo を既定にする。`--yolo` を毎回打つのと同じ状態 — 承認を求めず、サンドボックスも
# 通さない。codex 自身が「外側でサンドボックスされている環境向け」と警告する設定で、
# ここではその外側が「自分の機械」であることを承知のうえで選んでいる。
# 個別に絞りたいときは -a / -s のフラグが設定より優先されるので、そちらで上書きする。
approval_policy = "never"
sandbox_mode = "danger-full-access"

[plugins."github@openai-curated"]
enabled = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

[projects."/Users/gapul"]
trust_level = "trusted"

# nssh 先の Linux ホスト (home は /home/<user>)
[projects."/home/gapul"]
trust_level = "trusted"

[features]
hooks = true
