# 個人の好み (機種非依存)。TOML の仕様上、トップレベルのキーは
# 最初のテーブルヘッダより前に置く必要がある。
model = "gpt-5.5"
model_reasoning_effort = "medium"
personality = "pragmatic"

[plugins."github@openai-curated"]
enabled = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

[projects."/Users/gapul"]
trust_level = "trusted"

# nssh 先の Linux ホスト (home は /home/<user>)
[projects."/home/gapul"]
trust_level = "trusted"

[features]
hooks = true
