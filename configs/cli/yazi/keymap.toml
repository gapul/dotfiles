[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# jump-to-char: vim 風に頭文字でジャンプ (f)
[[mgr.prepend_keymap]]
on   = "f"
run  = "plugin jump-to-char"
desc = "Jump to a file/dir by its first char"

# smart-filter: インクリメンタル絞り込み + 自動 dir 侵入 (F)
[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

# smart-paste: hover 中の dir に貼り付け (無ければ cwd) (p で上書き)
[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory, or cwd"

# toggle-pane: プレビューを最大化/戻す (T) / 表示・非表示 (<A-p>)
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on   = "<A-p>"
run  = "plugin toggle-pane toggle-preview"
desc = "Show or hide the preview pane"

# i opens an external preview: Quick Look on macOS, the default viewer on Linux.
[[mgr.prepend_keymap]]
on   = "i"
run  = "shell 'if [ \"$(uname -s)\" = Darwin ]; then qlmanage -p \"$@\"; else xdg-open \"$1\"; fi' --orphan"
desc = "Inspect in external viewer"

# ─── yamb bookmarks (u = leader). Jump/add/delete/rename frequent dirs. ───
[[mgr.prepend_keymap]]
on   = [ "u", "a" ]
run  = "plugin yamb save"
desc = "Bookmark: add current dir"

[[mgr.prepend_keymap]]
on   = [ "u", "g" ]
run  = "plugin yamb jump_by_key"
desc = "Bookmark: jump by key"

[[mgr.prepend_keymap]]
on   = [ "u", "G" ]
run  = "plugin yamb jump_by_fzf"
desc = "Bookmark: jump by fzf"

[[mgr.prepend_keymap]]
on   = [ "u", "d" ]
run  = "plugin yamb delete_by_key"
desc = "Bookmark: delete by key"

[[mgr.prepend_keymap]]
on   = [ "u", "D" ]
run  = "plugin yamb delete_by_fzf"
desc = "Bookmark: delete by fzf"

[[mgr.prepend_keymap]]
on   = [ "u", "A" ]
run  = "plugin yamb delete_all"
desc = "Bookmark: delete all"

[[mgr.prepend_keymap]]
on   = [ "u", "r" ]
run  = "plugin yamb rename_by_key"
desc = "Bookmark: rename by key"

[[mgr.prepend_keymap]]
on   = [ "u", "R" ]
run  = "plugin yamb rename_by_fzf"
desc = "Bookmark: rename by fzf"
