# herdr の設定。母艦へは nix (modules/home/terminal.nix) が、nssh 先へは
# configs/bin/remote-bootstrap が symlink で配る。手で編集しない。
#
# ~/.config/herdr には herdr 自身の state (socket / log / session.json) が同居するため、
# ディレクトリごと symlink にはできない。gh / codex と同じくファイル単体を張る。
# herdr がこのファイルを書き戻すことがあるが、その書き込みは dotfiles の working tree に
# 落ちて次回接続の reset --hard で消える (gh の config.yml と同じ扱い)。
#
# 変更は次回 herdr 起動時に反映される (herdr はこのファイルを監視していない)。
# `herdr server reload-config` は使わない。サーバ側は成功するのに、繋いでいる
# クライアントだけ無反応になって開き直す羽目になる (2026-08-10 に 4 回再現)。
onboarding = false

[theme]
# tmux と同じ rose-pine。auto_switch が見るのは OS ではなく「端末」で、外側の端末へ
# OSC 11 (背景色) を問い合わせ、mode 2031 (テーマ更新通知) を購読して追従する。
# よって ssh 越しでも接続元 ghostty の切替がそのまま効き、サーバ側の OS は関係ない
# (2026-08 に Linux 上の herdr へ light の背景を返して dawn を選ぶことを実測)。
# 以前ここには「macOS の外観に追従 (他 OS では dark 固定)」と書いてあったが誤り。
#
# auto_switch の既定は false。つまりこのファイルが届いていないホストでは、herdr が
# 0.8.0 でも protocol が一致していてもテーマ追従は一切働かない。2026-08-15 に
# 実際にそうなっていた: nix の home.file は home-manager を通るホストにしか効かず、
# nssh も herdr の設定だけは張っていなかったため、リモートの config.toml は herdr 自身が
# 書いた `onboarding = false` の 19 バイトだけで [theme] が丸ごと無かった。
#
# ペイン内のプログラム (nvim / Claude Code の theme=auto) への中継は herdr 0.8.0 から。
# 0.7.5 では起動時の OSC 11 応答だけが返り、途中の切替は中まで届かなかった (#714)。
auto_switch = true
dark_name = "rose-pine"
light_name = "rose-pine-dawn"

[keys]
# tmux と同じ C-t。Emacs の C-b (backward-char) と衝突するため。
prefix = "ctrl+t"

[ui]
show_agent_labels_on_pane_borders = true

# [ui.toast] delivery = "system" は使わない。macOS でこれを付けると herdr は通知を
# 出す前に「今どの端末アプリの中か」を確かめようとして mdfind を叩き、それを
# クライアントの描画ループ上で同期実行する (platform::macos::show_desktop_notification
# → verified_terminal_bundle_identifier → Command::output)。Spotlight が詰まると
# mdfind は永久に返らず、タスクが完了するたびに TUI ごと固まる (2026-08-10 に遭遇。
# そのときは rclone の死んだ NFS マウントが残っていて mds が getattrlistbulk で
# 止まっていた)。OS 通知自体は Claude Code の Stop フック (agent-notify) が osascript で
# 出しているので、外しても手元に届く通知は変わらない。むしろ二重通知が一本になる。

[session]
# サーバの再起動時に、保存してあったエージェントのペインを一斉に resume しない。
# 既定は true で、これは 0.8.2 でも 0.9.0 でも変わっていない (バージョンの回帰ではなく、
# セッションにタブが溜まったぶんだけ効いてくる類の既定)。
#
# 2026-09-13 に母艦が再起動したとき、この既定のせいで Claude Code が 23 個、同じ秒に
# 立ち上がった (ペインは 33 枚、エージェントは claude 24 + codex 3)。付随する MCP サーバ
# を含めてプロセスは 807、8 コアに対して load average は 19.77 まで振れ、メモリは 16GB の
# うち空き 109MB・圧縮 6.2GB。
#
# 重くなるのはエージェント側だけではない。0.9.0 で端末 UI が各クライアントに移ったので
# (upstream #3487)、23 枚分の起動画面を ANSI にして端末へ書き出すのはクライアントの仕事に
# なった。そのときクライアントは 42.7% CPU、sample では 4288 サンプル中 3900 が
# present_frame -> write() の中だった。キー入力を描くのと同じスレッドなので入力が引っかかる。
# 落ち着いたあとの同じクライアントは 3.0%。
#
# false にしてもペインとタブは復元される。止まるのは各エージェントの会話セッションへの
# 自動再接続だけなので、要るものをそのつど手で resume する。
resume_agents_on_restore = false

[experimental]
# terminal-browser がペインに絵を出すのに要る。既定は false で、切っていると
# ペインは作られてブラウザのプロセスも前面に居座るのに、中身が何も描かれない。
# エラーも出ないので「開いたのに見えない」という形でしか気づけない。
#
# 描画はクライアント側なので、この値を変えたら `herdr server reload-config` の
# あとにクライアントを繋ぎ直すこと (ctrl+t q → herdr)。reload だけでは、繋がって
# いるクライアントが古い値を握ったままで、有効にしたのに一切描かれない状態が続く
# (2026-08-31 にここで数時間溶かした)。セッションはサーバー側が持っているので、
# 繋ぎ直しても開いているペインもその中のプロセスも失われない。
kitty_graphics = true
