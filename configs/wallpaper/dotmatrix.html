<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Dot-Matrix Ripple Wallpaper</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #191724; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* 右下の控えめなマーカー */
  .marker {
    position: fixed;
    bottom: 28px;
    right: 32px;
    color: rgba(224,222,244,0.22);  /* rose-pine text を薄く */
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    z-index: 10;
    pointer-events: none;
  }
  .marker .dot { color: rgba(196,167,231,0.55); }  /* iris */
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="marker">MATRIX <span class="dot">&middot;</span> WS <span id="wsnum">1</span></div>
<script src="system-theme.js"></script>
<script>
'use strict';

// ─────────── Rosé Pine (main / dark) パレット ───────────
// rose-pine.html からそのまま流用。
const RP = {
  base:    '25,23,36',    // #191724 背景 (一番暗い)
  surface: '31,29,46',    // #1f1d2e
  overlay: '38,35,58',    // #26233a
  muted:   '110,106,134', // #6e6a86
  subtle:  '144,140,170', // #908caa
  text:    '224,222,244', // #e0def4
  love:    '235,111,146', // #eb6f92 赤/ピンク
  gold:    '246,193,119', // #f6c177 黄
  rose:    '235,188,186', // #ebbcba ローズ
  pine:    '49,116,143',  // #31748f 青
  foam:    '156,207,216', // #9ccfd8 シアン
  iris:    '196,167,231', // #c4a7e7 紫
};
followSystemTheme(RP);
const rgb = s => s.split(',').map(Number);

// ─────────── workspace別アクセント + 波パラメータ ───────────
// 各 workspace = 色ペア(a→b grad) + 波の出方
//   spacing=格子間隔(小さいほど密) / sources=波源の数
const PALETTES = {
  '1': { a: RP.iris, b: RP.pine,    spacing: 26, sources: 2, speed: 0.4, freq: 0.018, waveSpeed: 2.4 }, // 紫→青 大きくゆったり
  '2': { a: RP.foam, b: RP.pine,    spacing: 22, sources: 3, speed: 0.7, freq: 0.030, waveSpeed: 3.2 }, // シアン→青 細かく速い
  '3': { a: RP.gold, b: RP.rose,    spacing: 28, sources: 2, speed: 0.35, freq: 0.016, waveSpeed: 2.0 }, // 金→ローズ なだらか
  '4': { a: RP.love, b: RP.iris,    spacing: 23, sources: 3, speed: 0.8, freq: 0.026, waveSpeed: 3.6 }, // 紅→紫 乱れた波
  '5': { a: RP.pine, b: RP.foam,    spacing: 25, sources: 2, speed: 0.5, freq: 0.020, waveSpeed: 2.6 }, // 青→シアン
  '6': { a: RP.iris, b: RP.love,    spacing: 24, sources: 3, speed: 0.6, freq: 0.024, waveSpeed: 3.0 }, // 紫→紅
  '7': { a: RP.foam, b: RP.iris,    spacing: 28, sources: 2, speed: 0.3, freq: 0.014, waveSpeed: 1.8 }, // シアン→紫 極ゆったり
  '8': { a: RP.rose, b: RP.love,    spacing: 22, sources: 3, speed: 0.7, freq: 0.028, waveSpeed: 3.3 }, // ローズ→紅
  '9': { a: RP.iris, b: RP.foam,    spacing: 25, sources: 2, speed: 0.5, freq: 0.022, waveSpeed: 2.8 }, // 紫→シアン
  '0': { a: RP.muted, b: RP.subtle, spacing: 26, sources: 2, speed: 0.3, freq: 0.018, waveSpeed: 1.6 }, // 灰 静かなモノクロ
  'S': { a: RP.pine, b: RP.iris,    spacing: 24, sources: 2, speed: 0.5, freq: 0.020, waveSpeed: 2.5 }, // 青→紫
};

let currentPalette = PALETTES['1'];
let started = false;

function applyWorkspace(ws) {
  ws = ws || '1';
  const next = PALETTES[ws] || PALETTES['1'];
  if (currentPalette === next) return;  // 変更なし
  currentPalette = next;
  buildSources(next);
  document.getElementById('wsnum').textContent = ws;
}

function startAnimation() {
  if (started) return;
  started = true;
  requestAnimationFrame(tick);
}

// 同階層の state.js を <script>タグで定期ロード (cache buster付き)
// state.js の内容: window.__ws = "3";
function pollWorkspace() {
  const s = document.createElement('script');
  s.src = 'state.js?_=' + Date.now();
  s.onload = () => { applyWorkspace(window.__ws); s.remove(); };
  s.onerror = () => { s.remove(); };
  document.head.appendChild(s);
}
setInterval(pollWorkspace, 300);

// ─────────── WebGL2 セットアップ ───────────
// 旧 Canvas2D 版は 1 フレームで約 7,500 セル × (arc + fillText) を個別発行し、
// GPU ドローコールが数千/フレームに達して重かった。ここでは波の場の計算と
// ドット描画をフラグメントシェーダに移し、全画面 1 パス(1 ドローコール)で描く。
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: true, premultipliedAlpha: false });

const VERT = `#version 300 es
in vec2 p;
void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

// 最大波源数。PALETTES は最大 3。余裕をみて 4。
const MAX_SRC = 4;
const FRAG = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2  uRes;      // device px (canvas.width/height)
uniform float uDpr;
uniform vec2  uOrigin;   // グリッド原点 (CSS px)
uniform float uSp;       // 格子間隔 (CSS px)
uniform float uMaxR;     // ドット最大半径 (CSS px)
uniform float uTime;
uniform float uFreq;
uniform float uWaveSpeed;
uniform int   uN;
uniform vec2  uSrc[${MAX_SRC}];   // 波源 (CSS px)
uniform float uPhase[${MAX_SRC}];
uniform vec3  uA, uB, uGold, uBg; // 0..255
uniform float uBright, uWarm;

float fieldAt(vec2 pt){
  float sum = 0.0;
  for(int i=0;i<${MAX_SRC};i++){
    if(i>=uN) break;
    vec2 d = pt - uSrc[i];
    float dist = length(d);
    float atten = 1.0/(1.0 + dist*0.0016);
    sum += sin(dist*uFreq - uTime*uWaveSpeed + uPhase[i]) * atten;
  }
  return 0.5 + 0.5*(sum/float(uN));
}

void main(){
  // gl_FragCoord は device px・左下原点。CSS px・左上原点へ変換。
  vec2 cssPx = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;
  vec2 cell   = floor((cssPx - uOrigin)/uSp + 0.5);
  vec2 center = uOrigin + cell*uSp;
  float v = fieldAt(center);

  vec3 bg = uBg/255.0;
  if(v < 0.12){ o = vec4(bg, 1.0); return; }

  // 色: a→b を v で補間 → 朝夕 gold 寄せ → 時刻明度。旧 2D 版と同一式。
  vec3 col = mix(uA, uB, v);
  col = mix(col, uGold, uWarm);
  col = min(vec3(255.0), col*uBright) / 255.0;

  float dd = length(cssPx - center);
  float radius = uMaxR * v;
  float dot = 1.0 - smoothstep(radius-1.0, radius+1.0, dd);
  float alpha = (0.12 + 0.85*v) * dot;
  vec3 outc = mix(bg, col, alpha);

  // 端末風アクセント: 明るいセルは内側にコアを重ねる (旧 fillText の代替)
  if(v > 0.55){
    float core = 1.0 - smoothstep(radius*0.5-1.0, radius*0.5+1.0, dd);
    outc = mix(outc, col, core*0.25);
  }
  o = vec4(outc, 1.0);
}`;

function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

// 全画面トライアングル
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uDpr','uOrigin','uSp','uMaxR','uTime','uFreq','uWaveSpeed','uN',
 'uSrc','uPhase','uA','uB','uGold','uBg','uBright','uWarm']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5); // GPU 側なので 1.5 で十分綺麗・省電力
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

// ─────────── 波源 (CPU 側・軽量) ───────────
// 各波源は画面内を直線運動し、端で反射する。workspace で個数/速度が変わる。
let sources = [];
function buildSources(P) {
  sources = [];
  for (let i = 0; i < P.sources; i++) {
    const ang = Math.random() * Math.PI * 2;
    sources.push({
      x: Math.random(), y: Math.random(),               // 0..1 正規化座標
      vx: Math.cos(ang) * P.speed, vy: Math.sin(ang) * P.speed,
      phase: Math.random() * Math.PI * 2,
    });
  }
}
buildSources(currentPalette);

function moveSources(dt) {
  for (const s of sources) {
    s.x += s.vx * dt * 0.05;
    s.y += s.vy * dt * 0.05;
    if (s.x < 0) { s.x = 0; s.vx = Math.abs(s.vx); }
    if (s.x > 1) { s.x = 1; s.vx = -Math.abs(s.vx); }
    if (s.y < 0) { s.y = 0; s.vy = Math.abs(s.vy); }
    if (s.y > 1) { s.y = 1; s.vy = -Math.abs(s.vy); }
  }
}

// 時刻に応じた色シフト (rose-pine.html の computeTimeShift をそのまま)
function computeTimeShift() {
  const now = new Date();
  const hr = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600 + now.getMilliseconds() / 3600000;
  const sunness = 0.5 * (1 + Math.cos((hr - 12) * Math.PI / 12));  // 0..1 正午=1, 真夜中=0
  const golden = Math.sin(Math.abs(hr - 12) * Math.PI / 12);       // 0..1 朝夕=1, 正午/深夜=0
  const warmth = golden * Math.min(1, sunness * 1.6);
  return {
    brightness: 0.78 + 0.27 * sunness,   // 夜0.78 → 昼1.05
    warmth,                              // 0..1 朝夕で最大
    bgLift: sunness,                     // 昼に背景を surface 寄りへ
  };
}

// 背景色を時間帯でティント (rose-pine.html の tintBg をそのまま流用)
function tintBg(c, t) {
  const top = rgb(RP.surface);
  const gold = rgb(RP.gold);
  const lift = t.bgLift * 0.22;
  const warm = t.warmth * 0.10;
  return c.map((v, i) => {
    let x = v + (top[i] - v) * lift;
    x = x + (gold[i] - x) * warm;
    return x;
  });
}

// ─────────── 描画ループ ───────────
let lastT = 0, lastFrame = 0;
const FRAME_MS = 33;  // ~30fps

const srcBuf = new Float32Array(MAX_SRC * 2);
const phaseBuf = new Float32Array(MAX_SRC);

function tick(ms) {
  requestAnimationFrame(tick);
  if (!lastT) lastT = ms;
  const dt = Math.min(0.1, (ms - lastT) / 1000);
  lastT = ms;
  if (ms - lastFrame < FRAME_MS) return;
  lastFrame = ms;

  const t = computeTimeShift();
  const P = currentPalette;
  const time = ms / 1000;
  moveSources(dt);

  const sp = P.spacing;
  const cols = Math.ceil(W / sp);
  const rows = Math.ceil(H / sp);
  const ox = (W - (cols - 1) * sp) / 2;
  const oy = (H - (rows - 1) * sp) / 2;

  const n = sources.length;
  for (let i = 0; i < n; i++) {
    srcBuf[i*2]   = sources[i].x * W;
    srcBuf[i*2+1] = sources[i].y * H;
    phaseBuf[i]   = sources[i].phase;
  }

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uDpr, DPR);
  gl.uniform2f(U.uOrigin, ox, oy);
  gl.uniform1f(U.uSp, sp);
  gl.uniform1f(U.uMaxR, sp * 0.46);
  gl.uniform1f(U.uTime, time);
  gl.uniform1f(U.uFreq, P.freq);
  gl.uniform1f(U.uWaveSpeed, P.waveSpeed);
  gl.uniform1i(U.uN, n);
  gl.uniform2fv(U.uSrc, srcBuf);
  gl.uniform1fv(U.uPhase, phaseBuf);
  gl.uniform3fv(U.uA, rgb(P.a));
  gl.uniform3fv(U.uB, rgb(P.b));
  gl.uniform3fv(U.uGold, rgb(RP.gold));
  gl.uniform3fv(U.uBg, tintBg(rgb(RP.base), t));
  gl.uniform1f(U.uBright, t.brightness);
  gl.uniform1f(U.uWarm, t.warmth * 0.35);

  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// 初期化
applyWorkspace('1');
startAnimation();
</script>
</body>
</html>
