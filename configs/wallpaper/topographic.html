<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Topographic Wallpaper</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #191724; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* 右下の控えめなマーカー */
  .marker {
    position: fixed;
    bottom: 28px;
    right: 32px;
    color: rgba(224,222,244,0.22);  /* rose-pine text を薄く */
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    z-index: 10;
    pointer-events: none;
  }
  .marker .dot { color: rgba(196,167,231,0.55); }  /* iris */
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="marker">TOPO <span class="dot">&middot;</span> WS <span id="wsnum">1</span></div>
<script src="system-theme.js"></script>
<script>
'use strict';

// ─────────── Rosé Pine (main / dark) パレット ───────────
// rose-pine.html と同一定義をそのまま流用。
const RP = {
  base:    '25,23,36',    // #191724 背景 (一番暗い)
  surface: '31,29,46',    // #1f1d2e
  overlay: '38,35,58',    // #26233a
  muted:   '110,106,134', // #6e6a86
  subtle:  '144,140,170', // #908caa
  text:    '224,222,244', // #e0def4
  love:    '235,111,146', // #eb6f92 赤/ピンク
  gold:    '246,193,119', // #f6c177 黄
  rose:    '235,188,186', // #ebbcba ローズ
  pine:    '49,116,143',  // #31748f 青
  foam:    '156,207,216', // #9ccfd8 シアン
  iris:    '196,167,231', // #c4a7e7 紫
};
followSystemTheme(RP);
const rgb = s => s.split(',').map(Number);

// ─────────── workspace別パラメータ (Topographic) ───────────
// 各 workspace = 色ペア(低標高lo→高標高hi) + contour本数 + noise scale。
//   lo/hi  : 等高線色。標高(level)で lo→hi を lerp し高度感を出す
//   levels : 等高線の本数(密度)
//   scale  : ノイズの粗さ(大きいほど細かい地形)
const PALETTES = {
  '1': { lo: RP.pine, hi: RP.iris,    levels: 7,  scale: 0.0022 }, // 青→紫 標準
  '2': { lo: RP.pine, hi: RP.foam,    levels: 10, scale: 0.0034 }, // 青→シアン 細かい
  '3': { lo: RP.rose, hi: RP.gold,    levels: 6,  scale: 0.0018 }, // ローズ→金 なだらか
  '4': { lo: RP.iris, hi: RP.love,    levels: 9,  scale: 0.0030 }, // 紫→紅 密
  '5': { lo: RP.foam, hi: RP.pine,    levels: 7,  scale: 0.0024 }, // シアン→青
  '6': { lo: RP.love, hi: RP.iris,    levels: 8,  scale: 0.0027 }, // 紅→紫
  '7': { lo: RP.foam, hi: RP.iris,    levels: 6,  scale: 0.0016 }, // シアン→紫 極なだらか
  '8': { lo: RP.gold, hi: RP.love,    levels: 9,  scale: 0.0031 }, // 金→紅
  '9': { lo: RP.iris, hi: RP.foam,    levels: 7,  scale: 0.0025 }, // 紫→シアン
  '0': { lo: RP.muted, hi: RP.subtle, levels: 6,  scale: 0.0020 }, // 灰 静かなモノクロ
  'S': { lo: RP.pine, hi: RP.rose,    levels: 8,  scale: 0.0023 }, // 青→ローズ
};

let currentPalette = PALETTES['1'];
let started = false;

function applyWorkspace(ws) {
  ws = ws || '1';
  const next = PALETTES[ws] || PALETTES['1'];
  if (currentPalette === next) return;  // 変更なし
  currentPalette = next;
  document.getElementById('wsnum').textContent = ws;
  // 毎フレーム uniform を更新するので、次フレームから新パラメータで描けば自然に切替わる。
}

function startAnimation() {
  if (started) return;
  started = true;
  requestAnimationFrame(tick);
}

// 同階層の state.js を <script>タグで定期ロード (cache buster付き)
// state.js の内容: window.__ws = "3";
function pollWorkspace() {
  const s = document.createElement('script');
  s.src = 'state.js?_=' + Date.now();
  s.onload = () => { applyWorkspace(window.__ws); s.remove(); };
  s.onerror = () => { s.remove(); };
  document.head.appendChild(s);
}
setInterval(pollWorkspace, 300);

// ─────────── WebGL2 セットアップ ───────────
// 旧 Canvas2D 版は 1 フレームで数万セルの marching squares を CPU で解き、
// level 本数ぶんの stroke を毎フレーム発行して重かった。ここでは高度場 h(x,y,t)
// の計算と等高線の描画をフラグメントシェーダへ移し、全画面 1 パス(1 ドローコール)
// で描く。等高線は fwidth ベースの距離しきい値でアンチエイリアスして引く。
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
if (!gl) throw new Error('WebGL2 が利用できません');

const VERT = `#version 300 es
in vec2 p;
void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const FRAG = `#version 300 es
precision highp float;
out vec4 o;

uniform vec2  uRes;        // device px (canvas.width/height)
uniform float uDpr;
uniform float uH;          // CSS px の画面高さ (背景グラデ用)
uniform float uScale;      // ノイズ scale
uniform float uUndulation; // 時間で進む地形のうねり量
uniform float uLevels;     // 等高線本数
uniform float uSpan;       // 等高線を配置する高度レンジ ±uSpan
uniform vec3  uLo, uHi;    // 低標高→高標高 の等高線色 (0..255)
uniform vec3  uGold;       // 朝夕の寄せ先 (0..255)
uniform vec3  uBgBase;     // ティント済み base (画面下、0..255)
uniform vec3  uBgTop;      // ティント済み surface (画面上、0..255)
uniform float uBright;     // 時刻明度
uniform float uWarm;       // 朝夕 gold 寄せ量

// ─── 勾配(Perlin)ノイズ ───
// 元 JS 版は乱数シャッフルした permutation テーブルの Perlin(勾配は ±x±y の
// 4対角)。perm はロード毎に Math.random で撹拌され再現性が無いため、ここでは
// 同種の (±1,±1) 対角勾配・quintic fade・2オクターブ fbm を GLSL で等価実装する。
float hash(vec2 c){
  // 格子点ごとの疑似乱数 0..1
  vec2 p = fract(c * vec2(0.1031, 0.1030));
  p += dot(p, p.yx + 33.33);
  return fract((p.x + p.y) * p.x);
}
// 格子点 c の勾配 (±1,±1) と オフセット d の内積 (元 grad と同種)
float dotGrad(vec2 c, vec2 d){
  float h  = hash(c);
  float sx = fract(h * 1.0) < 0.5 ? -1.0 : 1.0;
  float sy = fract(h * 7.0) < 0.5 ? -1.0 : 1.0;
  return sx * d.x + sy * d.y;
}
float noise2D(vec2 P){
  vec2 i = floor(P);
  vec2 f = P - i;
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0); // quintic fade (元 fade と同一)
  float a = dotGrad(i + vec2(0.0, 0.0), f - vec2(0.0, 0.0));
  float b = dotGrad(i + vec2(1.0, 0.0), f - vec2(1.0, 0.0));
  float c = dotGrad(i + vec2(0.0, 1.0), f - vec2(0.0, 1.0));
  float d = dotGrad(i + vec2(1.0, 1.0), f - vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
// 2オクターブ fbm (元 fbm と同一の重み・第2オクターブ倍率/オフセット)
float fbm(vec2 p){
  return noise2D(p) * 0.65 + noise2D(p * 2.13 + vec2(19.1, 7.3)) * 0.35;
}

void main(){
  // gl_FragCoord は device px・左下原点。CSS px・左上原点へ変換。
  vec2 cssPx = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;

  // 高度場 h(x,y,t)。元 2D 版と同じサンプル座標:
  //   x = px * scale,  y = py * scale + undulation
  float h = fbm(vec2(cssPx.x * uScale, cssPx.y * uScale + uUndulation));

  // ─── 背景: 上=surface, 中央以降=base の縦グラデ (元 paintBase と同方針) ───
  float gy = clamp(cssPx.y / (0.5 * uH), 0.0, 1.0);
  vec3 bg = mix(uBgTop, uBgBase, gy) / 255.0;
  vec3 outc = bg;

  // ─── 等高線 ───
  // 高度を 0..(levels-1) の連続値 m に写像。整数のところに等高線が来る。
  //   frac = (h + span) / (2*span),  m = frac * (levels-1)
  float m  = (h + uSpan) / (2.0 * uSpan) * (uLevels - 1.0);
  float aa = max(fwidth(m), 1e-5);          // 1px あたりの m 変化量 (分岐外で微分)
  float k  = floor(m + 0.5);                 // 最寄りの等高線 index
  // レンジ外(存在しない線)は描かない
  if (k >= 0.0 && k <= uLevels - 1.0) {
    float d   = abs(m - k);                  // m 空間での線までの距離
    float dpx = d / aa;                      // px 換算の距離

    float kfrac = uLevels > 1.0 ? k / (uLevels - 1.0) : 0.0; // 0..1 標高
    float lw    = 0.8 + 0.4 * kfrac;         // 線幅 0.8..1.2px (元と同一)

    // アンチエイリアスした線カバレッジ
    float cov = 1.0 - smoothstep(lw * 0.5 - 0.5, lw * 0.5 + 0.5, dpx);

    // 色: lo→hi を標高で lerp → 朝夕 gold 寄せ → 時刻明度 (元と同一式)
    vec3 col = mix(uLo, uHi, kfrac);
    col = mix(col, uGold, uWarm);
    col = min(vec3(255.0), col * uBright) / 255.0;

    float alpha = (0.32 + 0.30 * kfrac) * cov; // 高標高ほど濃い (元と同一)
    outc = mix(outc, col, alpha);
  }

  o = vec4(outc, 1.0);
}`;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

// 全画面トライアングル
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uDpr','uH','uScale','uUndulation','uLevels','uSpan',
 'uLo','uHi','uGold','uBgBase','uBgTop','uBright','uWarm']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5); // GPU 側なので 1.5 で十分綺麗・省電力
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

// 時刻に応じた色シフト (rose-pine.html / 旧2D版と同一)。
function computeTimeShift() {
  const now = new Date();
  const hr = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600 + now.getMilliseconds() / 3600000;
  const sunness = 0.5 * (1 + Math.cos((hr - 12) * Math.PI / 12));  // 0..1 正午=1, 真夜中=0
  const golden = Math.sin(Math.abs(hr - 12) * Math.PI / 12);       // 0..1 朝夕=1, 正午/深夜=0
  const warmth = golden * Math.min(1, sunness * 1.6);
  return {
    brightness: 0.78 + 0.27 * sunness,   // 夜0.78 → 昼1.05
    warmth,                              // 0..1 朝夕で最大
    bgLift: sunness,                     // 昼に背景を surface 寄りへ
  };
}

// 背景色を時間帯でティント (旧2D版の tintBg をそのまま流用)。
function tintBg(c, t) {
  const top = rgb(RP.surface);
  const gold = rgb(RP.gold);
  const lift = t.bgLift * 0.22;   // 昼: surface へ最大22%
  const warm = t.warmth * 0.10;   // 朝夕: gold へ最大10%
  return c.map((v, i) => {
    let x = v + (top[i] - v) * lift;
    x = x + (gold[i] - x) * warm;
    return x;
  });
}

// ─────────── 描画ループ ───────────
let lastFrame = 0;
const FRAME_MS = 33;    // ~30fps に間引いて負荷を抑える
const span = 1.4;       // -span..span に等高線を配置 (元と同一)
let undulation = 0;     // 時間で進める undulation 量

function tick(ms) {
  requestAnimationFrame(tick);  // 停止せず回し続ける
  if (ms - lastFrame < FRAME_MS) return;
  lastFrame = ms;

  const t = computeTimeShift();
  const P = currentPalette;

  undulation += 0.0008;  // ゆっくり地形がうねる (元と同一)

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uDpr, DPR);
  gl.uniform1f(U.uH, H);
  gl.uniform1f(U.uScale, P.scale);
  gl.uniform1f(U.uUndulation, undulation);
  gl.uniform1f(U.uLevels, P.levels);
  gl.uniform1f(U.uSpan, span);
  gl.uniform3fv(U.uLo, rgb(P.lo));
  gl.uniform3fv(U.uHi, rgb(P.hi));
  gl.uniform3fv(U.uGold, rgb(RP.gold));
  gl.uniform3fv(U.uBgBase, tintBg(rgb(RP.base), t));
  gl.uniform3fv(U.uBgTop, tintBg(rgb(RP.surface), t));
  gl.uniform1f(U.uBright, t.brightness);
  gl.uniform1f(U.uWarm, t.warmth * 0.30);  // 朝夕で gold 寄せ (元と同一)

  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// 初期化
applyWorkspace('1');
startAnimation();
</script>
</body>
</html>
