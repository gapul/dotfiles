<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Rosé Pine Constellation Wallpaper</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #191724; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* 右下の控えめなマーカー */
  .marker {
    position: fixed;
    bottom: 28px;
    right: 32px;
    color: rgba(224,222,244,0.22);  /* rose-pine text を薄く */
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    z-index: 10;
    pointer-events: none;
  }
  .marker .dot { color: rgba(196,167,231,0.55); }  /* iris */
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="marker">CONST <span class="dot">&middot;</span> WS <span id="wsnum">1</span></div>
<script src="system-theme.js"></script>
<script>
'use strict';

// ─────────── Rosé Pine (main / dark) パレット ───────────
const RP = {
  base:    '25,23,36',    // #191724 背景 (一番暗い)
  surface: '31,29,46',    // #1f1d2e
  overlay: '38,35,58',    // #26233a
  muted:   '110,106,134', // #6e6a86
  subtle:  '144,140,170', // #908caa
  text:    '224,222,244', // #e0def4
  love:    '235,111,146', // #eb6f92 赤/ピンク
  gold:    '246,193,119', // #f6c177 黄
  rose:    '235,188,186', // #ebbcba ローズ
  pine:    '49,116,143',  // #31748f 青
  foam:    '156,207,216', // #9ccfd8 シアン
  iris:    '196,167,231', // #c4a7e7 紫
};
followSystemTheme(RP);
const rgb = s => s.split(',').map(Number);

// ─────────── workspace別パラメータ (Constellation) ───────────
//   count = ノード数 / dist = 接続閾値(px, 大きいほど密) / speed = ドリフト速度
const PALETTES = {
  '1': { a: RP.iris, b: RP.pine,    count: 72, dist: 140, speed: 0.30 }, // 紫→青 標準
  '2': { a: RP.foam, b: RP.pine,    count: 88, dist: 120, speed: 0.42 }, // シアン→青 高密・素早い
  '3': { a: RP.gold, b: RP.rose,    count: 60, dist: 150, speed: 0.24 }, // 金→ローズ 疎・ゆったり
  '4': { a: RP.love, b: RP.iris,    count: 84, dist: 130, speed: 0.46 }, // 紅→紫 活発
  '5': { a: RP.pine, b: RP.foam,    count: 70, dist: 138, speed: 0.32 }, // 青→シアン
  '6': { a: RP.iris, b: RP.love,    count: 78, dist: 132, speed: 0.36 }, // 紫→紅
  '7': { a: RP.foam, b: RP.iris,    count: 62, dist: 158, speed: 0.22 }, // シアン→紫 疎・大網
  '8': { a: RP.rose, b: RP.love,    count: 82, dist: 126, speed: 0.40 }, // ローズ→紅 密
  '9': { a: RP.iris, b: RP.foam,    count: 74, dist: 136, speed: 0.34 }, // 紫→シアン
  '0': { a: RP.muted, b: RP.subtle, count: 64, dist: 144, speed: 0.18 }, // 灰 静かなモノクロ
  'S': { a: RP.pine, b: RP.iris,    count: 76, dist: 140, speed: 0.30 }, // 青→紫
};

let currentPalette = PALETTES['1'];
// 色は滑らかに lerp するため、表示中の実効パラメータを別に保持する。
let liveA = rgb(currentPalette.a).slice();
let liveB = rgb(currentPalette.b).slice();
let liveDist = currentPalette.dist;

let started = false;

function applyWorkspace(ws) {
  ws = ws || '1';
  const next = PALETTES[ws] || PALETTES['1'];
  if (currentPalette === next) return;  // 変更なし
  currentPalette = next;
  document.getElementById('wsnum').textContent = ws;
  syncNodeCount(next.count);
}

function startAnimation() {
  if (started) return;
  started = true;
  requestAnimationFrame(tick);
}

// 同階層の state.js を <script>タグで定期ロード (cache buster付き)
function pollWorkspace() {
  const s = document.createElement('script');
  s.src = 'state.js?_=' + Date.now();
  s.onload = () => { applyWorkspace(window.__ws); s.remove(); };
  s.onerror = () => { s.remove(); };
  document.head.appendChild(s);
}
setInterval(pollWorkspace, 300);

// ─────────── WebGL2 セットアップ ───────────
// 旧 Canvas2D 版は接続線を 1 本ずつ ctx.stroke() で発行し(最大 ~4000 本/フレーム)、
// さらに 60fps 上限なしで回していた。ここでは全接続線を 1 本の頂点バッファに
// まとめて gl.LINES で 1 ドローコール、ノードも gl.POINTS で 1 ドローコールにする。
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: true, premultipliedAlpha: false });

function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
function link(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

// 背景: 上半分で surface→base の縦グラデ、下半分は base 一色 (旧 createLinearGradient と同じ)。
const bgProg = link(
  `#version 300 es
   in vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`,
  `#version 300 es
   precision highp float; out vec4 o;
   uniform vec2 uRes; uniform vec3 uTop, uBot;
   void main(){
     float yy = 1.0 - gl_FragCoord.y/uRes.y;   // 0=上 .. 1=下
     float k = clamp(yy/0.5, 0.0, 1.0);         // 上半分だけ top→bot
     o = vec4(mix(uTop, uBot, k)/255.0, 1.0);
   }`);
const bgU = { uRes: gl.getUniformLocation(bgProg,'uRes'), uTop: gl.getUniformLocation(bgProg,'uTop'), uBot: gl.getUniformLocation(bgProg,'uBot') };
const bgVao = gl.createVertexArray();
gl.bindVertexArray(bgVao);
const bgBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
{ const l = gl.getAttribLocation(bgProg,'p'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0); }

// ジオメトリ (線・点共用): aPos=CSS px, aColor=rgba(0..1), aSize=点径(CSS px)。
const geomProg = link(
  `#version 300 es
   in vec2 aPos; in vec4 aColor; in float aSize;
   uniform vec2 uRes; uniform float uDpr;
   out vec4 vColor;
   void main(){
     vec2 clip = vec2(aPos.x/uRes.x*2.0-1.0, 1.0 - aPos.y/uRes.y*2.0);
     gl_Position = vec4(clip, 0.0, 1.0);
     gl_PointSize = aSize * uDpr;
     vColor = aColor;
   }`,
  `#version 300 es
   precision highp float; in vec4 vColor; out vec4 o;
   uniform int uMode;   // 0=線, 1=点(丸くマスク)
   void main(){
     float a = vColor.a;
     if(uMode==1){
       float r = length(gl_PointCoord - vec2(0.5));
       a *= smoothstep(0.5, 0.4, r);
     }
     o = vec4(vColor.rgb, a);
   }`);
const geomU = {
  uRes: gl.getUniformLocation(geomProg,'uRes'),
  uDpr: gl.getUniformLocation(geomProg,'uDpr'),
  uMode: gl.getUniformLocation(geomProg,'uMode'),
};
const STRIDE = 7 * 4; // x,y,r,g,b,a,size
function makeGeomVao(buf){
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const pl = gl.getAttribLocation(geomProg,'aPos');
  const cl = gl.getAttribLocation(geomProg,'aColor');
  const sl = gl.getAttribLocation(geomProg,'aSize');
  gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl,2,gl.FLOAT,false,STRIDE,0);
  gl.enableVertexAttribArray(cl); gl.vertexAttribPointer(cl,4,gl.FLOAT,false,STRIDE,8);
  gl.enableVertexAttribArray(sl); gl.vertexAttribPointer(sl,1,gl.FLOAT,false,STRIDE,24);
  return vao;
}
const lineBuf = gl.createBuffer();
const pointBuf = gl.createBuffer();
const lineVao = makeGeomVao(lineBuf);
const pointVao = makeGeomVao(pointBuf);

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

// 時刻に応じた色シフト
function computeTimeShift() {
  const now = new Date();
  const hr = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600 + now.getMilliseconds() / 3600000;
  const sunness = 0.5 * (1 + Math.cos((hr - 12) * Math.PI / 12));
  const golden = Math.sin(Math.abs(hr - 12) * Math.PI / 12);
  const warmth = golden * Math.min(1, sunness * 1.6);
  return { brightness: 0.78 + 0.27 * sunness, warmth, bgLift: sunness };
}
function tintBg(c, t) {
  const top = rgb(RP.surface);
  const gold = rgb(RP.gold);
  const lift = t.bgLift * 0.22;
  const warm = t.warmth * 0.10;
  return c.map((v, i) => {
    let x = v + (top[i] - v) * lift;
    x = x + (gold[i] - x) * warm;
    return x;
  });
}

// ─────────── ノード (CPU 側・軽量: 最大90) ───────────
const MAX_N = 90;
const nodes = [];
let activeN = currentPalette.count;
function makeNode() {
  return {
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() * 2 - 1), vy: (Math.random() * 2 - 1),
    r: 1.5 + Math.random() * 1.0,
  };
}
for (let i = 0; i < MAX_N; i++) nodes.push(makeNode());
function syncNodeCount(n) { activeN = Math.max(10, Math.min(MAX_N, n | 0)); }
syncNodeCount(currentPalette.count);

const lerp1 = (a, b, t) => a + (b - a) * t;

// 頂点バッファ (最大サイズを先に確保)。線: 最大 n*(n-1)/2 本 × 2頂点 × 7float。
const MAX_LINE_VERT = (MAX_N * (MAX_N - 1) / 2) * 2;
const lineData = new Float32Array(MAX_LINE_VERT * 7);
const pointData = new Float32Array(MAX_N * 7);

// ─────────── 描画ループ (~30fps) ───────────
let lastFrame = 0;
const FRAME_MS = 33;

function tick(now) {
  requestAnimationFrame(tick);
  if (now - lastFrame < FRAME_MS) return;
  lastFrame = now;

  const t = computeTimeShift();
  const br = t.brightness;
  const warm = t.warmth * 0.30;
  const [gR, gG, gB] = rgb(RP.gold);

  // 色・閾値を目標へ滑らかに追従
  const tgtA = rgb(currentPalette.a);
  const tgtB = rgb(currentPalette.b);
  for (let i = 0; i < 3; i++) {
    liveA[i] = lerp1(liveA[i], tgtA[i], 0.06);
    liveB[i] = lerp1(liveB[i], tgtB[i], 0.06);
  }
  liveDist = lerp1(liveDist, currentPalette.dist, 0.06);

  const speed = currentPalette.speed;
  const dist = liveDist;
  const dist2 = dist * dist;

  // ノード移動 (端で反射)
  for (let i = 0; i < activeN; i++) {
    const p = nodes[i];
    p.x += p.vx * speed; p.y += p.vy * speed;
    if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); }
    if (p.x > W) { p.x = W; p.vx = -Math.abs(p.vx); }
    if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy); }
    if (p.y > H) { p.y = H; p.vy = -Math.abs(p.vy); }
  }

  // 色ヘルパ: k(0..1) で a→b → gold寄せ → 明度。0..1 で返す。
  const colAt = (k) => {
    let mr = liveA[0] + (liveB[0] - liveA[0]) * k;
    let mg = liveA[1] + (liveB[1] - liveA[1]) * k;
    let mb = liveA[2] + (liveB[2] - liveA[2]) * k;
    mr += (gR - mr) * warm; mg += (gG - mg) * warm; mb += (gB - mb) * warm;
    return [Math.min(255, mr * br) / 255, Math.min(255, mg * br) / 255, Math.min(255, mb * br) / 255];
  };

  // 接続線の頂点を構築 (O(n^2), n<=90)
  let lv = 0;
  for (let i = 0; i < activeN; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < activeN; j++) {
      const b = nodes[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx * dx + dy * dy;
      if (d2 >= dist2) continue;
      const d = Math.sqrt(d2);
      const alpha = (1 - d / dist) * 0.45;
      const [cr, cg, cb] = colAt(((a.x + b.x) * 0.5) / W);
      lineData[lv++] = a.x; lineData[lv++] = a.y; lineData[lv++] = cr; lineData[lv++] = cg; lineData[lv++] = cb; lineData[lv++] = alpha; lineData[lv++] = 0;
      lineData[lv++] = b.x; lineData[lv++] = b.y; lineData[lv++] = cr; lineData[lv++] = cg; lineData[lv++] = cb; lineData[lv++] = alpha; lineData[lv++] = 0;
    }
  }
  const lineVerts = lv / 7;

  // ノードの頂点を構築
  let pv = 0;
  for (let i = 0; i < activeN; i++) {
    const p = nodes[i];
    const [cr, cg, cb] = colAt(p.x / W);
    pointData[pv++] = p.x; pointData[pv++] = p.y; pointData[pv++] = cr; pointData[pv++] = cg; pointData[pv++] = cb; pointData[pv++] = 0.85; pointData[pv++] = p.r * 2;
  }

  // 描画: 背景(不透明) → 線 → 点 (通常アルファ合成)
  const bg = tintBg(rgb(RP.base), t);
  const top = tintBg(rgb(RP.surface), t);
  gl.disable(gl.BLEND);
  gl.useProgram(bgProg);
  gl.bindVertexArray(bgVao);
  gl.uniform2f(bgU.uRes, canvas.width, canvas.height);
  gl.uniform3f(bgU.uTop, top[0], top[1], top[2]);
  gl.uniform3f(bgU.uBot, bg[0], bg[1], bg[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(geomProg);
  gl.uniform2f(geomU.uRes, W, H);
  gl.uniform1f(geomU.uDpr, DPR);

  gl.uniform1i(geomU.uMode, 0);
  gl.bindVertexArray(lineVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
  gl.bufferData(gl.ARRAY_BUFFER, lineData.subarray(0, lv), gl.DYNAMIC_DRAW);
  gl.lineWidth(1);
  gl.drawArrays(gl.LINES, 0, lineVerts);

  gl.uniform1i(geomU.uMode, 1);
  gl.bindVertexArray(pointVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, pointBuf);
  gl.bufferData(gl.ARRAY_BUFFER, pointData.subarray(0, pv), gl.DYNAMIC_DRAW);
  gl.drawArrays(gl.POINTS, 0, activeN);
}

// 初期化
applyWorkspace('1');
startAnimation();
</script>
</body>
</html>
