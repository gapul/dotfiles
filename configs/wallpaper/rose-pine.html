<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Rosé Pine Flow Wallpaper</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #191724; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* 右下の控えめなマーカー */
  .marker {
    position: fixed;
    bottom: 28px;
    right: 32px;
    color: rgba(224,222,244,0.22);  /* rose-pine text を薄く */
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    z-index: 10;
    pointer-events: none;
  }
  .marker .dot { color: rgba(196,167,231,0.55); }  /* iris */
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="marker">ROS&Eacute; PINE <span class="dot">&middot;</span> WS <span id="wsnum">1</span></div>
<script src="system-theme.js"></script>
<script>
'use strict';

// ─────────── Rosé Pine (main / dark) パレット ───────────
// nix/lib/theme.nix の hex をそのまま RGB 文字列化したもの。
// テーマ切替 (theme.nix の active) に追従させたい場合はここを差し替える。
const RP = {
  base:    '25,23,36',    // #191724 背景 (一番暗い)
  surface: '31,29,46',    // #1f1d2e
  overlay: '38,35,58',    // #26233a
  muted:   '110,106,134', // #6e6a86
  subtle:  '144,140,170', // #908caa
  text:    '224,222,244', // #e0def4
  love:    '235,111,146', // #eb6f92 赤/ピンク
  gold:    '246,193,119', // #f6c177 黄
  rose:    '235,188,186', // #ebbcba ローズ
  pine:    '49,116,143',  // #31748f 青
  foam:    '156,207,216', // #9ccfd8 シアン
  iris:    '196,167,231', // #c4a7e7 紫
};
followSystemTheme(RP);
const rgb = s => s.split(',').map(Number);

// ─────────── workspace別アクセント (Rosé Pine内で完結) ───────────
// 各ワークスペースに 2 色のアクセントを割り当て、フロー場の noise で
// 2 色間を RGB 補間する。背景は常に rose-pine base。
// 各 workspace = 色ペア + 流れの模様
//   scale=ノイズの粗さ(大きいほど細かい渦) / twist=渦の強さ / speed=線速度
//   drift=模様が時間で流れる速さ / width=線幅
const PALETTES = {
  '1': { a: RP.iris, b: RP.pine,    scale: 0.0015, twist: 2.6, speed: 1.3, drift: 0.0007, width: 0.9 }, // 紫→青 ゆったり大波
  '2': { a: RP.foam, b: RP.pine,    scale: 0.0030, twist: 3.6, speed: 1.5, drift: 0.0011, width: 0.7 }, // シアン→青 細かい渦
  '3': { a: RP.gold, b: RP.rose,    scale: 0.0020, twist: 2.4, speed: 1.2, drift: 0.0006, width: 1.0 }, // 金→ローズ なだらか
  '4': { a: RP.love, b: RP.iris,    scale: 0.0026, twist: 4.0, speed: 1.6, drift: 0.0012, width: 0.7 }, // 紅→紫 乱流
  '5': { a: RP.pine, b: RP.foam,    scale: 0.0017, twist: 3.0, speed: 1.4, drift: 0.0009, width: 0.8 }, // 青→シアン
  '6': { a: RP.iris, b: RP.love,    scale: 0.0024, twist: 3.4, speed: 1.5, drift: 0.0010, width: 0.8 }, // 紫→紅
  '7': { a: RP.foam, b: RP.iris,    scale: 0.0013, twist: 2.2, speed: 1.2, drift: 0.0006, width: 1.1 }, // シアン→紫 極ゆったり
  '8': { a: RP.rose, b: RP.love,    scale: 0.0028, twist: 3.8, speed: 1.5, drift: 0.0011, width: 0.7 }, // ローズ→紅
  '9': { a: RP.iris, b: RP.foam,    scale: 0.0021, twist: 3.2, speed: 1.4, drift: 0.0009, width: 0.8 }, // 紫→シアン
  '0': { a: RP.muted, b: RP.subtle, scale: 0.0016, twist: 2.0, speed: 1.0, drift: 0.0005, width: 0.9 }, // 灰 静かなモノクロ
  'S': { a: RP.pine, b: RP.iris,    scale: 0.0019, twist: 2.8, speed: 1.3, drift: 0.0008, width: 0.9 }, // 青→紫
};

let currentPalette = PALETTES['1'];

// 常時アニメーション (停止しない)。時刻シフトは毎フレーム計算されるので
// 一日の色変化はそのまま反映される。バッテリー時は Plash 側の
// deactivateOnBattery=1 が web view を止めるため、AC 中のみ動き続ける。
let started = false;

function applyWorkspace(ws) {
  ws = ws || '1';
  const next = PALETTES[ws] || PALETTES['1'];
  if (currentPalette === next) return;  // 変更なし
  currentPalette = next;
  document.getElementById('wsnum').textContent = ws;
  // 背景は塗り直さない。常時走っている tick() の trail フェード (feedback buffer)
  // に任せれば、古い軌跡が薄れつつ新色のラインが重なって自然にクロスフェードする。
}

function startAnimation() {
  if (started) return;
  started = true;
  requestAnimationFrame(tick);
}

// 同階層の state.js を <script>タグで定期ロード (cache buster付き)
// state.js の内容: window.__ws = "3";
function pollWorkspace() {
  const s = document.createElement('script');
  s.src = 'state.js?_=' + Date.now();
  s.onload = () => { applyWorkspace(window.__ws); s.remove(); };
  s.onerror = () => { s.remove(); };
  document.head.appendChild(s);
}
setInterval(pollWorkspace, 300);

// ─────────── 時刻シフト / 背景ティント (旧 Canvas2D 版と同一) ───────────
// 時刻に応じた色シフト。Rosé Pine は dark テーマなので白飛びはさせず、
// 「明度」「暖色度 (golden hour)」「昼の持ち上げ」で一日の表情を変える。
//   深夜  : 最も沈み、寒色 (iris/pine)。warmth=0
//   朝焼け: 暖色 (gold) が乗る。warmth≈1, bgLift 低
//   正午  : 最も明るい。brightness≈1.05, bgLift≈1, warmth=0
//   夕焼け: 暖色 (gold) が乗る。warmth≈1
function computeTimeShift() {
  const now = new Date();
  const hr = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600 + now.getMilliseconds() / 3600000;
  const sunness = 0.5 * (1 + Math.cos((hr - 12) * Math.PI / 12));  // 0..1 正午=1, 真夜中=0
  const golden = Math.sin(Math.abs(hr - 12) * Math.PI / 12);       // 0..1 朝夕=1, 正午/深夜=0
  // 朝夕でも太陽が出ている時間帯 (sunness がある程度高い) のみ暖色を強める
  const warmth = golden * Math.min(1, sunness * 1.6);
  return {
    brightness: 0.78 + 0.27 * sunness,   // 夜0.78 → 昼1.05
    warmth,                              // 0..1 朝夕で最大
    bgLift: sunness,                     // 昼に背景を surface 寄りへ
    trailAlpha: 0.06 + 0.03 * sunness,   // 昼は少し速くフェード (くっきり)
  };
}

// 背景色を時間帯でティントする (rose-pine 内で完結):
//   昼   … surface 寄りに持ち上げ (わずかに明るく)
//   朝夕 … gold をうっすら混ぜて暖色化 (golden hour)
//   夜   … base のまま最も沈める
function tintBg(c, t) {
  const top = rgb(RP.surface);
  const gold = rgb(RP.gold);
  const lift = t.bgLift * 0.22;   // 昼: surface へ最大22%
  const warm = t.warmth * 0.10;   // 朝夕: gold へ最大10%
  return c.map((v, i) => {
    let x = v + (top[i] - v) * lift;
    x = x + (gold[i] - x) * warm;
    return x;
  });
}

// ─────────── Perlinノイズ (簡易版) ───────────
// 粒子の進行角と色は CPU 側でこの fbm から決める (旧版と同じ乱数場)。
// GPU では計算せず、粒子ごとの座標/色を軽量に uniform (instance 属性) で渡す。
const perm = new Uint8Array(512);
{
  const p = [];
  for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
}
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const lerp = (a, b, t) => a + t * (b - a);
const grad = (h, x, y) => {
  const u = (h & 1) ? -x : x;
  const v = (h & 2) ? -y : y;
  return u + v;
};
function noise2D(x, y) {
  const X = Math.floor(x) & 255;
  const Y = Math.floor(y) & 255;
  x -= Math.floor(x); y -= Math.floor(y);
  const u = fade(x), v = fade(y);
  const A = perm[X] + Y, B = perm[X + 1] + Y;
  return lerp(
    lerp(grad(perm[A],     x,     y),     grad(perm[B],     x - 1, y),     u),
    lerp(grad(perm[A + 1], x,     y - 1), grad(perm[B + 1], x - 1, y - 1), u),
    v
  );
}
// 2オクターブの fractal noise (fbm)。単一ノイズより模様に階層が出て richer に。
function fbm(x, y) {
  return noise2D(x, y) * 0.65 + noise2D(x * 2.13 + 19.1, y * 2.13 + 7.3) * 0.35;
}

// ─────────── パーティクル (CPU 側・軽量) ───────────
// 旧版と同じく画面初期サイズ基準で 200 粒子。位置/寿命は CPU で更新し、
// 各フレーム「線分 (prev→cur) + 色」を instance 属性として 1 ドローで GPU へ。
const N = 200;
const particles = [];
const w = window.innerWidth;   // 旧版同様、粒子場は初期ウィンドウサイズ基準
const h = window.innerHeight;
for (let i = 0; i < N; i++) {
  particles.push({
    x: Math.random() * w,
    y: Math.random() * h,
    life: Math.random() * 200,
  });
}

// ─────────── WebGL2 セットアップ ───────────
// 旧 Canvas2D 版は毎フレーム base の fillRect (trail フェード) と 200 本の
// stroke を main thread で発行していた。ここでは軌跡の蓄積を ping-pong の
// フィードバック FBO へ移し、
//   1) fade パス   : 前フレームのテクスチャを base 方向へ薄く混ぜて軌跡を残す
//                    (フラグメントシェーダで全画面 1 パス = 旧 fillRect 相当)
//   2) streak パス : 各粒子の線分を拡張クアッドの instancing で 1 ドロー描画。
//                    線分 SDF + smoothstep で丸キャップと柔らかい縁を per-pixel 生成
//   3) blit        : 完成テクスチャを画面へコピー
// のように GPU 側で完結させ、CPU 負荷とドローコールを大幅に削減する。
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
if (!gl) throw new Error('WebGL2 not supported');

// ── フルスクリーン三角形用 頂点シェーダ (fade / init 共用) ──
const VERT_FS = `#version 300 es
in vec2 p;
void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

// ── init: 縦グラデ (上=surface / 下=base) を種テクスチャに描く (旧 paintBase 相当) ──
const FRAG_INIT = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec3 uTop;    // tinted surface 0..255
uniform vec3 uBase;   // tinted base    0..255
out vec4 o;
void main(){
  float t = gl_FragCoord.y / uRes.y;          // 1 = 画面上端 (GL は左下原点)
  float f = clamp((t - 0.5) / 0.5, 0.0, 1.0); // 上半分だけ surface へ寄せ, 下半分 base
  vec3 c = mix(uBase / 255.0, uTop / 255.0, f);
  o = vec4(c, 1.0);
}`;

// ── fade: 前フレームを base 方向へ trailAlpha 分だけ混ぜる (旧 fillRect(base,a) 相当) ──
const FRAG_FADE = `#version 300 es
precision highp float;
uniform sampler2D uPrev;
uniform vec2  uRes;
uniform vec3  uBg;     // tinted base 0..255
uniform float uTrail;  // trailAlpha
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 prev = texture(uPrev, uv).rgb;
  vec3 base = uBg / 255.0;
  o = vec4(mix(prev, base, uTrail), 1.0);  // source-over: mix(dst, base, a)
}`;

// ── streak: 粒子の線分を拡張クアッドで受け, per-pixel に線分 SDF で丸ライン化 ──
const VERT_STREAK = `#version 300 es
in vec2 aCorner;  // テンプレ (x:0..1 進行方向, y:-1..1 側方)
in vec2 aA;       // 線分始点 (device px, 左下原点)
in vec2 aB;       // 線分終点
in vec3 aColor;   // 線色 0..1 (時刻/warmth/brightness 反映済)
uniform vec2  uRes;
uniform float uRad;   // 線半径 (device px)
uniform float uAA;    // アンチエイリアス幅
flat out vec2 vA;
flat out vec2 vB;
flat out vec3 vColor;
void main(){
  vec2 dir = aB - aA;
  float len = length(dir);
  dir = len > 1e-4 ? dir / len : vec2(1.0, 0.0);
  vec2 perp = vec2(-dir.y, dir.x);
  float rad = uRad + uAA + 1.0;                       // 丸キャップ + AA 余白ぶん外へ拡張
  vec2 base = mix(aA, aB, aCorner.x);
  vec2 pos = base + dir * rad * (aCorner.x * 2.0 - 1.0) + perp * rad * aCorner.y;
  vA = aA; vB = aB; vColor = aColor;
  vec2 clip = pos / uRes * 2.0 - 1.0;                 // device px(左下原点) → clip
  gl_Position = vec4(clip, 0.0, 1.0);
}`;

const FRAG_STREAK = `#version 300 es
precision highp float;
flat in vec2 vA;
flat in vec2 vB;
flat in vec3 vColor;
uniform float uRad;
uniform float uAA;
out vec4 o;
float segDist(vec2 p, vec2 a, vec2 b){
  vec2 pa = p - a, ba = b - a;
  float hh = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
  return length(pa - ba * hh);
}
void main(){
  float d = segDist(gl_FragCoord.xy, vA, vB);
  float cov = 1.0 - smoothstep(uRad - uAA, uRad + uAA, d);  // 丸キャップの柔らかい縁
  float a = 0.7 * cov;                                       // 旧 stroke alpha=0.7
  if (a < 0.003) discard;
  o = vec4(vColor, a);
}`;

// ── コンパイル / リンク (infolog を throw してガード) ──
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('compile: ' + gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(vsrc, fsrc, binds) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsrc));
  for (const [name, loc] of binds) gl.bindAttribLocation(p, loc, name);  // VAO 共用のため場所を固定
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  return p;
}
function uniforms(prog, names) {
  const U = {};
  names.forEach(n => U[n] = gl.getUniformLocation(prog, n));
  return U;
}

const progInit   = makeProgram(VERT_FS, FRAG_INIT,   [['p', 0]]);
const progFade   = makeProgram(VERT_FS, FRAG_FADE,   [['p', 0]]);
const progStreak = makeProgram(VERT_STREAK, FRAG_STREAK,
  [['aCorner', 0], ['aA', 1], ['aB', 2], ['aColor', 3]]);

const uInit   = uniforms(progInit,   ['uRes', 'uTop', 'uBase']);
const uFade   = uniforms(progFade,   ['uPrev', 'uRes', 'uBg', 'uTrail']);
const uStreak = uniforms(progStreak, ['uRes', 'uRad', 'uAA']);

// ── フルスクリーン三角形 VAO (init / fade 共用) ──
const fsVAO = gl.createVertexArray();
gl.bindVertexArray(fsVAO);
const fsBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, fsBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ── streak VAO (corner: 非 instanced / 線分・色: instanced) ──
const instData = new Float32Array(N * 7);          // 1粒子 = [Ax,Ay,Bx,By, Cr,Cg,Cb]
const streakVAO = gl.createVertexArray();
gl.bindVertexArray(streakVAO);
const cornerBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  0, -1,  1, -1,  1, 1,   // 2 三角形で線分を包む矩形
  0, -1,  1,  1,  0, 1,
]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(0, 0);
const instBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.bufferData(gl.ARRAY_BUFFER, instData.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 28, 0);  gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 28, 8);  gl.vertexAttribDivisor(2, 1);
gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 3, gl.FLOAT, false, 28, 16); gl.vertexAttribDivisor(3, 1);
gl.bindVertexArray(null);

// ─────────── ping-pong フィードバック FBO ───────────
let DPR, W, H;
let tex = [null, null];
let fbo = [null, null];
let read = 0;                       // 参照側 index (書き込みは 1-read)

function makeTex(cw, ch) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, cw, ch, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function makeFbo(t) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return f;
}

// 種テクスチャに縦グラデ (旧 paintBase) を焼き込む
function seedGradient(fboTarget) {
  const t = computeTimeShift();
  const top  = tintBg(rgb(RP.surface), t);
  const base = tintBg(rgb(RP.base), t);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboTarget);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.BLEND);
  gl.useProgram(progInit);
  gl.bindVertexArray(fsVAO);
  gl.uniform2f(uInit.uRes, canvas.width, canvas.height);
  gl.uniform3fv(uInit.uTop, top);
  gl.uniform3fv(uInit.uBase, base);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);  // GPU 側なので 1.5 で十分綺麗・省電力
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  // FBO 群を作り直す (旧 resize が paintBase で軌跡をリセットするのと同じ挙動)
  for (const t of tex) if (t) gl.deleteTexture(t);
  for (const f of fbo) if (f) gl.deleteFramebuffer(f);
  tex = [makeTex(canvas.width, canvas.height), makeTex(canvas.width, canvas.height)];
  fbo = [makeFbo(tex[0]), makeFbo(tex[1])];
  read = 0;
  seedGradient(fbo[0]);   // 参照側だけ種を焼けば十分 (書き込み側は毎フレ全面更新)
  seedGradient(fbo[1]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
resize();
window.addEventListener('resize', resize);

// ─────────── 描画ループ (~30fps) ───────────
let lastFrame = 0;
let frame = 0;
const FRAME_MS = 33;

function tick(ms) {
  requestAnimationFrame(tick);
  if (ms - lastFrame < FRAME_MS) return;   // ~30fps に制限
  lastFrame = ms;

  const t = computeTimeShift();
  const P = currentPalette;
  const write = 1 - read;
  const ch = canvas.height;

  // ── 粒子更新 (CPU): 線分 (prev→cur) と色を instance 配列へ ──
  const [aR, aG, aB] = rgb(P.a);
  const [bR, bG, bB] = rgb(P.b);
  const [gR, gG, gB] = rgb(RP.gold);   // golden hour で寄せる暖色
  const warm = t.warmth * 0.35;        // 朝夕で最大35% gold 寄せ
  const br = t.brightness;
  for (let i = 0; i < N; i++) {
    const p = particles[i];
    // fractal ノイズ場から角度算出 (workspace毎に scale/twist/速度が異なる)
    const n = fbm(p.x * P.scale, p.y * P.scale + frame * P.drift);
    const angle = n * Math.PI * P.twist;
    const vx = Math.cos(angle) * P.speed;
    const vy = Math.sin(angle) * P.speed;

    // 色: アクセント2色を noise で RGB 補間 → 朝夕は gold へ寄せ → 時刻明度を乗算
    const mix = (n + 1) * 0.5;
    let mr = aR + (bR - aR) * mix;
    let mg = aG + (bG - aG) * mix;
    let mb = aB + (bB - aB) * mix;
    mr += (gR - mr) * warm;
    mg += (gG - mg) * warm;
    mb += (gB - mb) * warm;

    const prevX = p.x, prevY = p.y;
    p.x += vx;
    p.y += vy;

    const o = i * 7;
    instData[o]     = prevX * DPR;         // device px (左下原点へ y 反転)
    instData[o + 1] = ch - prevY * DPR;
    instData[o + 2] = p.x * DPR;
    instData[o + 3] = ch - p.y * DPR;
    instData[o + 4] = Math.min(255, mr * br) / 255;
    instData[o + 5] = Math.min(255, mg * br) / 255;
    instData[o + 6] = Math.min(255, mb * br) / 255;

    // 寿命管理: 一定時間で再生成
    p.life--;
    if (p.life < 0 || p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
      p.x = Math.random() * w;
      p.y = Math.random() * h;
      p.life = 150 + Math.random() * 200;
    }
  }

  // ── 1) fade パス: 前フレーム(read)を base 方向へ薄く混ぜて write へ ──
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[write]);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.BLEND);
  gl.useProgram(progFade);
  gl.bindVertexArray(fsVAO);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex[read]);
  gl.uniform1i(uFade.uPrev, 0);
  gl.uniform2f(uFade.uRes, canvas.width, canvas.height);
  gl.uniform3fv(uFade.uBg, tintBg(rgb(RP.base), t));
  gl.uniform1f(uFade.uTrail, t.trailAlpha);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // ── 2) streak パス: 粒子の線分を write へ alpha ブレンドで重ねる ──
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);   // 旧 stroke の source-over 相当
  gl.useProgram(progStreak);
  gl.bindVertexArray(streakVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, instData);
  const half = P.width * DPR * 0.5;                      // 線半径 (旧 lineWidth=P.width)
  gl.uniform2f(uStreak.uRes, canvas.width, canvas.height);
  gl.uniform1f(uStreak.uRad, half);
  gl.uniform1f(uStreak.uAA, 1.0);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, N);
  gl.disable(gl.BLEND);

  // ── 3) blit: 完成した write テクスチャを画面へコピー ──
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo[write]);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  gl.blitFramebuffer(0, 0, canvas.width, canvas.height,
                     0, 0, canvas.width, canvas.height,
                     gl.COLOR_BUFFER_BIT, gl.NEAREST);

  read = write;   // swap
  frame++;
}

// 初期化: workspace を適用してループ開始
applyWorkspace('1');
startAnimation();
</script>
</body>
</html>
