# app_guard の監視対象。常時起動していてほしいアプリをここに列挙する。
# 1 行 1 アプリ。形式は  表示名 | pgrep パターン | 再起動コマンド(省略可) | 実行ファイル(省略可)
#   - pgrep パターンは `pgrep -f` に渡す。プロセス名かコマンドラインの一部。
#   - 再起動コマンドを書くと、警告アイコンのクリックで落ちているものだけ起動し直す。
#   - 実行ファイルを書くと、まずそれが解決できるかを見る。名前なら PATH から、
#     / で始まれば絶対パスとして。解決できなければ「停止」ではなく「実行ファイル無し」
#     として別の色で出す。再起動しても直らない種類なので区別する。
#
#     これは実害から足した。keystats を cask から nix パッケージにしたとき CLI の置き場所が
#     動き、バーの PATH から外れた。プラグインは見つからない項目を黙って隠す作りだったので、
#     エラーも出ないまま表示だけが消え、気づく手がかりが何も無かった (dotfiles #494)。
#     隠すのではなくここに出す。
#
# 行頭 # はコメント。不要な行は消すか # で無効化する。

sketchybar    | sketchybar                   | launchctl kickstart -k gui/$UID/org.nix-community.home.sketchybar | sketchybar
Puddle        | Puddle                        | open -a Puddle                                                    | /Applications/Nix Apps/Puddle.app/Contents/MacOS/Puddle
keystats      | keystatsd                     | open -a Keystats                                                  | keystats
espanso       | espanso                       | open -a espanso                                                   | espanso
Karabiner     | Karabiner-Core-Service        | open -a Karabiner-Elements
ActivityWatch | aw-qt                         | open -a aw-qt
