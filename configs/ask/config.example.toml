[broker]
# Bind on the tailnet so an agent on the mac mini reaches the same broker. 127.0.0.1 keeps it
# local-only, which is the safer default until the far end is actually needed.
host = "127.0.0.1"
port = 8933

# Only these can ever be the subject of login_fill. Nothing else reaches the vault, approved or
# not. Keep passkey-only accounts off this list on purpose: they are the accounts an agent should
# structurally be unable to enter.
allowed_domains = ["github.com"]

# Re-lock after this long without a release.
vault_idle_seconds = 900

# How long the person at the terminal gets before the question goes to the phone.
local_timeout_seconds = 90
remote_timeout_seconds = 600

# Touch ID (or a paired Apple Watch). Built by helper/build.sh in github.com/gapul/ask; the
# channel is skipped when the app is not installed.
touch_id_app = "~/Applications/AskApprove.app"

# sops-managed, mode 0400.
vault_password_file = "~/.config/ask/bw-password"

# Required as soon as host is anything but loopback: the broker refuses to start on a reachable
# address without one. sops-managed, mode 0400.
#token_file = "~/.config/ask/token"

audit_log = "~/.local/state/ask/audit.jsonl"

# Native filling writes one currently focused text field and never presses Submit. The named
# target can be local (no ssh_target) or a trusted Mac reached over SSH. Apps are constrained to
# the credential domains they may receive.
[native_targets.macmini]
ssh_target = "gapul@100.105.135.49"
identity_file = "~/.ssh/id_automation"

[native_targets.macmini.apps]
"com.adobe.acc.AdobeCreativeCloud" = ["adobe.com"]

[matrix]
homeserver = "https://gapul.net"
room = "!yourroomid:gapul.net"
token_file = "~/.config/ask/matrix-token"
