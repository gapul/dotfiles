# Puddle: what this machine may install, and what it should have.
# Read by Puddle itself and by the `puddle` CLI.

# Catalogs to browse. One JSON file each, listing installable wallpapers.
indexes = [
    "https://github.com/gapul/puddle-shaders/releases/latest/download/index.json",
    "https://github.com/gapul/puddle-chess/releases/latest/download/index.json",
]

# Sources that install without being asked about — prefix match on the whole URL.
#
# This is also the only way a plugin installs: a shader is compiled for the GPU and can do
# nothing but draw, so a dialog is a fair defence, but a plugin is native code loaded into
# Puddle and a dialog is not. That trust is declared here, in advance, or not at all.
allow = [
    "https://github.com/gapul/puddle-shaders/releases/",
    # A plugin: native code, loaded into Puddle. Mine, and built from a repository I can read.
    "https://github.com/gapul/puddle-chess/releases/",
]

# What this machine should have. `puddle apply` installs whatever is missing.
wallpapers = [
    "dotmatrix",
    "worldmap",
    "globe",
    "constellation",
    "topographic",
    "aurora",
    "aurora-gradient",
    "rose-pine",
    "audio-bars",
    "puddle-chess",
]

# How Puddle behaves on this machine. Only the few keys worth having identical everywhere; the rest
# of the settings window stays the user's, and Puddle disables exactly these toggles and points at
# this file. Must stay last: TOML gives every key after a table header to that table.
#
# These lived in system.defaults.CustomUserPreferences until Puddle could read them here. That route
# goes through `defaults write`, which resolved to the sandbox container that a retired build left
# behind, so the declaration sat in a file the running app never read — deactivateOnBattery was
# declared on 2026-08-08 and still false in the live domain a month later. Declaring it where the app
# actually looks removes the gap instead of papering over it.
[settings]
deactivateOnBattery = true
showOnAllSpaces = true
extendPuddleBelowMenuBar = true
