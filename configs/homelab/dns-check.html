<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNS check</title>
<style>
  body { font: 17px -apple-system, system-ui, sans-serif; margin: 0; padding: 20px; background: #111; color: #eee; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #1c1c1c; color: #eee; }
  button { font: inherit; padding: 12px 16px; border-radius: 10px; border: 0; background: #2b6cb0; color: #fff; }
  button.warn { background: #b7791f; }
  #out, #status { margin-top: 16px; padding: 12px; border-radius: 10px; background: #1c1c1c; white-space: pre-wrap; word-break: break-all; }
  .blocked { color: #fc8181; } .ok { color: #68d391; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  small { color: #999; }
</style>
<h1>DNS check (blocky)</h1>
<form id="f"><input id="d" placeholder="example.com" autocapitalize="none" autocorrect="off" inputmode="url"><button>確認</button></form>
<div id="out"><small>ドメインを入れて確認。両方のリゾルバ (homeserver / macmini) に聞きます。</small></div>
<div class="row"><button class="warn" id="off">10 分だけブロックを止める</button><button id="on">再開</button></div>
<div id="status"><small>…</small></div>
<p><small><a href="dns-check.mobileconfig" style="color:#63b3ed">iPhone のホーム画面に置く(構成プロファイル)</a></small></p>
<script>
const R = { homeserver: '', macmini: '/mm' };
const q = async (base, path, opt) => (await fetch(base + path, opt)).json();
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function check(name) {
  const out = document.getElementById('out'); out.innerHTML = '…';
  const lines = [];
  for (const [r, base] of Object.entries(R)) {
    try {
      const j = await q(base, '/api/query', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ query: name, type: 'A' }) });
      const blocked = /^BLOCKED/.test(j.reason || '');
      lines.push(`<b>${r}</b>: <span class="${blocked ? 'blocked' : 'ok'}">${esc(j.reason)}</span>` + (j.response ? `\n  ${esc(j.response)}` : ''));
    } catch (e) { lines.push(`<b>${r}</b>: error ${esc(e)}`); }
  }
  out.innerHTML = lines.join('\n');
}
async function status() {
  const el = document.getElementById('status'); const lines = [];
  for (const [r, base] of Object.entries(R)) {
    try { const j = await q(base, '/api/blocking/status'); lines.push(`<b>${r}</b>: ` + (j.enabled ? '<span class="ok">ブロック中</span>' : `<span class="blocked">停止中</span> (あと ${j.autoEnableInSec ?? '?'} 秒)`)); }
    catch (e) { lines.push(`<b>${r}</b>: error ${esc(e)}`); }
  }
  el.innerHTML = lines.join('\n');
}
async function toggle(path) { for (const base of Object.values(R)) { try { await fetch(base + path); } catch (e) {} } status(); }
document.getElementById('f').onsubmit = e => { e.preventDefault(); const v = document.getElementById('d').value.trim().replace(/^https?:\/\//, '').split('/')[0]; if (v) check(v); };
document.getElementById('off').onclick = () => toggle('/api/blocking/disable?duration=10m');
document.getElementById('on').onclick = () => toggle('/api/blocking/enable');
status();
</script>
