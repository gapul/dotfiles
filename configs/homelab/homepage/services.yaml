---
# gapul.net homelab — 全部 homeserver (100.127.129.31) の中。
# 生存確認は siteMonitor に統一してある。移行でネイティブ化したサービス
# (conduit / syncthing / blocky / gatus など) には docker コンテナが無く、
# server+container 方式だと片方だけ光らないため。

- Home:
    - Home Assistant:
        href: https://home.gapul.net
        description: スマートホーム
        icon: home-assistant.png
        siteMonitor: http://127.0.0.1:8123
    - ESPHome:
        href: https://esphome.gapul.net
        description: 自作デバイスのファーム管理
        icon: esphome.png
        siteMonitor: http://127.0.0.1:6052
    - Node-RED:
        href: https://nodered.gapul.net
        description: 自動化フロー
        icon: node-red.png
        siteMonitor: http://127.0.0.1:1880

- Infrastructure:
    - Gatus:
        href: https://status.gapul.net
        description: 稼働監視 (uptime-kuma の後継)
        icon: gatus.png
        siteMonitor: http://127.0.0.1:8084
    - Attic:
        href: https://cache.gapul.net
        description: 自前の Nix バイナリキャッシュ
        icon: nixos.png
        siteMonitor: http://127.0.0.1:8083
    - Blocky:
        href: https://dns2.gapul.net
        description: DNS フィルタ (API のみ、UI は無い)
        icon: mdi-dns
        siteMonitor: http://127.0.0.1:4000
    - Syncthing:
        href: https://sync.gapul.net
        description: ファイル同期
        icon: syncthing.png
        siteMonitor: http://127.0.0.1:8384
    - ファイル閲覧 (restic):
        href: https://files.gapul.net
        description: バックアップの中身をプレビュー (read-only)
