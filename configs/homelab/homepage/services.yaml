- macmini (M4):
    - System:
        icon: mdi-desktop-tower-monitor
        href: http://100.105.135.49:61208
        widget:
          type: glances
          url: http://100.105.135.49:61208
          version: 4
          metric: info
    - CPU:
        widget: { type: glances, url: http://100.105.135.49:61208, version: 4, metric: cpu, chart: false }
