---
# gapul.net homelab: everything lives on homeserver (100.127.129.31) unless noted.
# Liveness checks use siteMonitor throughout. Services that became native during
# the migration (conduit / syncthing / blocky / gatus ...) have no container, so the
# server+container style would light up only half of the tiles.

- Home:
    - Home Assistant:
        href: https://home.gapul.net
        description: Smart home
        icon: home-assistant.png
        siteMonitor: http://127.0.0.1:8123
    - Node-RED:
        href: https://nodered.gapul.net
        description: Automation flows
        icon: node-red.png
        siteMonitor: http://127.0.0.1:1880

