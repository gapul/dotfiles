# rose-pine (rose-pine) — generated by scripts/gen-tmux-theme.py from
# configs/theme/palettes.json. DO NOT EDIT BY HAND.
#
# home-manager を通らないホスト (nssh 先) 専用。母艦では nix が生成する
# ~/.config/tmux/theme.conf が使われ、こちらは読まれない
# (tmux.conf 側で theme.conf の不在を条件にしている)。
set -g status-position top
set -g status-interval 5
set -g status-justify left

set -g status-style               "bg=#191724,fg=#908caa"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left  "#[bg=#31748f,fg=#191724,bold] #S #[bg=#191724,fg=#31748f]#[default] "
# 母艦版と違い resurrect の保存時刻は出さない (プラグインがリモートに無いため)。
# PREFIX バッジは client_prefix の変化で tmux が再描画するので interval に依らず即座に出る。
set -g status-right "#{?client_prefix,#[bg=#eb6f92#,fg=#191724#,bold] PREFIX #[default] ,}#[fg=#6e6a86]%Y-%m-%d #[fg=#9ccfd8]%H:%M "

# inactive / active windows (tabs)
set -g window-status-format         "#[fg=#6e6a86] #I #W "
set -g window-status-current-format "#[bg=#26233a,fg=#c4a7e7,bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#f6c177"

# pane border / message / copy mode
set -g pane-border-style        "fg=#26233a"
set -g pane-active-border-style "fg=#31748f"
set -g message-style            "bg=#26233a,fg=#e0def4"
set -g message-command-style    "bg=#26233a,fg=#e0def4"
set -g mode-style               "bg=#403d52,fg=#e0def4"
set -g display-panes-active-colour "#c4a7e7"
set -g display-panes-colour        "#6e6a86"
set -g clock-mode-colour           "#9ccfd8"
