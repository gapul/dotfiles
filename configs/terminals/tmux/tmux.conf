# tmux 設定 (zellij 代替)。
#   nix (modules/home/terminal.nix) が ~/.config/tmux/ に symlink し、
#   rose-pine テーマ (~/.config/tmux/rose-pine.conf) をパレットから生成して source する。
#   キーバインドは zellij の操作感を移植:
#     - prefix は Ctrl-b (zellij の tmux モードと同じ)
#     - Alt+hjkl / Alt+矢印 で prefix 無しペイン移動 (zellij の shared_except locked 相当)
#     - コピーモードは vi キー + pbcopy 連携

# ── 基本 ────────────────────────────────────────────────────────────
# TERM=xterm-ghostty を尊重しつつ truecolor を有効化 (terminal.nix が terminfo 配布)。
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc,*:Tc"
set  -ga terminal-features  ",xterm-ghostty:RGB,*:RGB"

set  -g  mouse on                 # zellij mouse_mode true 相当
set  -g  base-index 1             # ウィンドウ(タブ)番号を 1 始まり
setw -g  pane-base-index 1        # ペイン番号を 1 始まり
set  -g  renumber-windows on      # ウィンドウを閉じたら番号を詰める
set  -g  history-limit 10000      # zellij scroll_buffer_size 10000 相当
set  -sg escape-time 0            # Alt バインド / vim の Esc 遅延を消す (必須)
set  -g  focus-events on          # nvim の autoread / フォーカス連動
set  -g  set-clipboard on         # OSC52 でクリップボード連携
set  -g  display-time 2000
setw -g  mode-keys vi             # コピーモードを vi キーに
set  -g  status-keys emacs        # コマンドプロンプトは emacs キー
set  -g  allow-rename off

# ── ペイン操作 (zellij pane モード相当) ─────────────────────────────
# 直感的な分割記号。分割時は現在の cwd を継承。
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# zellij tmux モードと同じ記号も用意
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind n   split-window -v -c "#{pane_current_path}"   # zellij pane: n=NewPane
bind r   split-window -h -c "#{pane_current_path}"   # zellij pane: r=NewPane right
bind x   kill-pane
bind z   resize-pane -Z                              # zoom (zellij fullscreen)
bind o   select-pane -t :.+                          # 次のペイン
# prefix + hjkl でペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# prefix + HJKL でリサイズ (連打可)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── ウィンドウ = タブ (zellij tab モード相当) ───────────────────────
bind c   new-window      -c "#{pane_current_path}"
bind ,   command-prompt -I "#W" "rename-window '%%'"
bind X   kill-window
bind tab last-window                                 # 直前のタブ (zellij tab: tab)
bind -r p previous-window
bind -r N next-window
# prefix + [ でウィンドウを入れ替え (zellij Alt i / Alt o 相当)
bind -r "[" swap-window -t -1\; select-window -t -1
bind -r "]" swap-window -t +1\; select-window -t +1

# ── prefix 無し: Alt+hjkl / Alt+矢印 でペイン移動 (zellij の要) ──────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R
# Alt+n 新規ペイン, Alt+f zoom (zellij Alt n / Alt f 相当)
bind -n M-n split-window -v -c "#{pane_current_path}"
bind -n M-f resize-pane -Z
# Alt +/- リサイズ (zellij Alt +/-)
bind -n "M-+" resize-pane -U 3
bind -n "M--" resize-pane -D 3
# Alt+i / Alt+o でタブ(ウィンドウ)移動 (zellij Alt i/o は MoveTab だがここは focus)
bind -n M-i previous-window
bind -n M-o next-window

# ── コピーモード (zellij scroll/search 相当) ────────────────────────
bind [ copy-mode
bind ] paste-buffer
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# ── セッション / 雑務 ───────────────────────────────────────────────
bind d detach-client
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind s choose-tree -Zs                               # セッション/ウィンドウ選択 (zellij session-manager 相当)

# ── テーマ (rose-pine, nix がパレットから生成) ──────────────────────
source-file -q ~/.config/tmux/rose-pine.conf
