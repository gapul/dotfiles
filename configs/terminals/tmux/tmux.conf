# tmux 設定。母艦・リモートともこれが唯一の多重化ソフト (zellij は 2026-08 に撤去)。
#   nix (modules/home/terminal.nix) が ~/.config/tmux/ に symlink し、
#   rose-pine テーマ (dark=rose-pine.conf / light=rose-pine-dawn.conf) をパレットから生成、
#   theme.conf が macOS の外観に応じてどちらかを source する (ライト/ダーク自動追従)。
#   キーの割り当ては tmux デフォルト > herdr デフォルト > zellij デフォルト の順で決める。
#   つまり tmux が既定を持つキーはそれを潰さない。tmux が何も割り当てていないキーだけ
#   herdr (AI エージェント多重化ツール) の既定で埋め、そこも空なら zellij の既定で埋める。
#     - prefix は Ctrl-t (Emacs の C-b backward-char との衝突を避けるため唯一ここだけ変更)
#     - herdr 由来: prefix+e スクロールバック編集, prefix+hjkl ペイン移動, prefix+HJKL リサイズ
#     - zellij 由来: Alt+hjkl / Alt+矢印 でペイン移動, Alt+n 新規ペイン, Alt+f フローティング,
#       Alt +/- リサイズ, Alt+i / Alt+o でタブ移動, prefix+S ペイン同期入力
#     - コピーモードは vi キー + pbcopy 連携
#     - continuum の保存間隔 1 分 (zellij の 60 秒シリアライズに合わせた。terminal.nix)
#   優先順位を曲げた例外は 3 つだけ (どれも失うものより得るものが大きいと判断した):
#     - prefix+l: tmux 既定は last-window だが hjkl ペイン移動を優先。last-window は
#       prefix+Tab へ移した (herdr は Tab をペイン巡回に使うが tmux には o と ; がある)
#     - prefix+-: tmux 既定は delete-buffer だが herdr に合わせて上下分割
#     - prefix+x: tmux 既定の確認プロンプトを省いて即 kill-pane
#   借りなかったもの: スタックペイン (tmux に概念が無い。ズームで足りる)

# ── prefix ──────────────────────────────────────────────────────────
# Emacs の C-b (backward-char) と衝突するため prefix を C-t へ変更。
# C-t (transpose-chars) を内側の Emacs に送りたい時は C-t C-t と 2 連打する。
set  -g  prefix C-t
unbind C-b
bind C-t send-prefix

# ── 基本 ────────────────────────────────────────────────────────────
# TERM=xterm-ghostty を尊重しつつ truecolor を有効化 (terminal.nix が terminfo 配布)。
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc,*:Tc"
set  -ga terminal-features  ",xterm-ghostty:RGB,*:RGB"
# Ghostty 連携: 内側アプリのエスケープ列を素通し (Kitty 画像プロトコル / ネスト OSC52)。
set  -g  allow-passthrough on
# undercurl (色付き波線下線)。nvim の LSP 診断等を tmux 越しでも Ghostty に通す。
set  -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set  -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m"
# カーソル形状 (DECSCUSR)。nvim のモード別カーソル (block/beam) を Ghostty に通す。
set  -ga terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[ q"

set  -g  mouse on                 # zellij mouse_mode true 相当
set  -g  base-index 1             # ウィンドウ(タブ)番号を 1 始まり
setw -g  pane-base-index 1        # ペイン番号を 1 始まり
set  -g  renumber-windows on      # ウィンドウを閉じたら番号を詰める
set  -g  history-limit 10000      # zellij scroll_buffer_size 10000 相当
set  -sg escape-time 0            # Alt バインド / vim の Esc 遅延を消す (必須)
set  -g  focus-events on          # nvim の autoread / フォーカス連動
set  -g  set-clipboard on         # OSC52 でクリップボード連携
set  -g  display-time 2000
setw -g  mode-keys vi             # コピーモードを vi キーに
set  -g  status-keys emacs        # コマンドプロンプトは emacs キー
set  -g  allow-rename off

# ── ペイン操作 ──────────────────────────────────────────────────────
# 分割は tmux 既定の記号 (" 上下 / % 左右) を維持しつつ cwd を継承させる。
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
# | は tmux が何も割り当てていないので左右分割の別名に、
# - は tmux 既定 (delete-buffer) を潰すが herdr の split_horizontal に合わせて上下分割にする。
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane                                     # 既定の確認プロンプトだけ省く
# prefix + hjkl でペイン移動 (tmux 未割り当て → herdr の focus_pane_* に合わせる)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# prefix + HJKL でリサイズ (連打可。herdr の resize モードに相当するものが tmux に無いため)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── ウィンドウ = タブ ───────────────────────────────────────────────
# c / , / & / n / p / s / w は tmux 既定のまま (herdr もタブ操作は同じ並びなので触らない)。
# ここで上書きするのは cwd 継承と、hjkl に取られた l の移設だけ。
bind c new-window -c "#{pane_current_path}"
# 直前のタブ。tmux 既定は l だがペイン移動に使ったので Tab へ移す。
bind tab last-window
# 全ペインに同じ入力を流す (zellij tab: s = ToggleActiveSyncTab)。
# prefix + s は tmux 既定の choose-tree なので大文字に置く。
bind S setw synchronize-panes \; display "sync-panes #{?pane_synchronized,on,off}"
# 既定の n / p を連打できるようにするだけ
bind -r n next-window
bind -r p previous-window

# ── prefix 無し: Alt+hjkl / Alt+矢印 でペイン移動 (zellij の要) ──────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R
# Alt+n 新規ペイン (zellij Alt+n)
bind -n M-n split-window -v -c "#{pane_current_path}"
# Alt+f フローティングペイン (zellij Alt+f = ToggleFloatingPanes)。
# tmux にペインを浮かせる概念は無いので、scratch セッションを popup に映して代用する。
# セッションなので中身は閉じても生き続け、次に開くと同じ状態で出てくる。
# popup の中でもう一度押すと、内側のクライアントが detach して閉じる。
# zoom は tmux 既定の prefix+z にある。
bind -n M-f if-shell -F '#{==:#{session_name},scratch}' \
  'detach-client' \
  'display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 80% -E "tmux new-session -A -s scratch"'
# Alt +/- リサイズ (zellij Alt +/-)
bind -n "M-+" resize-pane -U 3
bind -n "M--" resize-pane -D 3
# Alt+i / Alt+o でタブを左右に動かす (zellij Alt i/o = MoveTab)。
# タブの移動先へフォーカスも connect させる。タブの選択自体は prefix+n / prefix+p。
bind -n M-i swap-window -t -1 \; select-window -t -1
bind -n M-o swap-window -t +1 \; select-window -t +1

# ── コピーモード ────────────────────────────────────────────────────
# [ 開始 / ] 貼り付けは tmux 既定のまま。
# スクロールバックをエディタで開く (herdr edit_scrollback = prefix+e)。
# copy-mode の e は vi の「単語末尾へ」を潰してしまうので、prefix 側に置く。
bind e run-shell "~/.config/tmux/scrollback-edit.sh '#{pane_id}'"
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# ── セッション / 雑務 ───────────────────────────────────────────────
# d (detach) と s (セッション選択) は tmux 既定のまま。s だけ全画面表示にする。
bind s choose-tree -Zs
# 設定リロード (herdr reload_config = prefix+shift+r)
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── ネスト tmux (SSH 先の tmux) 操作トグル ──────────────────────────
# 手元 tmux の中で SSH 先の tmux に入ると prefix (C-t) が常に外側に食われる。
# F12 で外側の prefix を一時 OFF にし、キーを内側 tmux へ素通しさせる。
# OFF 中はステータスバーを love 色に変えて「素通しモード」だと分かるようにする。
# もう一度 F12 で元に戻す (set -u で theme.conf の値へ復帰)。
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "bg=#eb6f92,fg=#191724" \;\
  refresh-client -S
bind -T off  F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# ── テーマ (rose-pine, nix がパレットから生成) ──────────────────────
# theme.conf が macOS の外観 (ライト/ダーク) を見て rose-pine / rose-pine-dawn を選ぶ。
# 外観変更時は theme-watch エージェントがこの theme.conf を再 source して追従する。
source-file -q ~/.config/tmux/theme.conf

# ── プラグイン (resurrect + continuum, nix が store パスを生成) ──────
# continuum は最下部で読む必要があるため、必ずこのファイルの末尾で source する。
#   セッション永続化: prefix+Ctrl-s 保存 / prefix+Ctrl-r 復元
#   continuum が 15 分毎に自動保存し、tmux サーバ起動時に自動復元する。
#   レイアウトは tmuxp で管理: `tmuxp load <name>` (~/.config/tmuxp/*.yaml)
source-file -q ~/.config/tmux/plugins.conf
