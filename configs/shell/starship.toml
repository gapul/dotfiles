# 全体タイムアウト：重い計測は即座に諦める
command_timeout = 200
add_newline = false
scan_timeout = 10

format = """
$directory\
$git_branch\
$cmd_duration\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = false
style = "cyan"

[character]
success_symbol = "[\\$](bold green)"
error_symbol   = "[\\$](bold red)"

[cmd_duration]
min_time = 2000          # 2秒以上のコマンドだけ表示
format  = " [$duration]($style)"
style   = "yellow"

[git_branch]
symbol = " "
style  = "purple"
# 末尾スペースは git_status を消した分の区切り（旧: git_status が " " を出していた）
format = " [$symbol$branch]($style) "

# git_status はプロンプト描画時間の大半を占めるので無効化（実測 44ms / 全体 20ms 中の最大要因）。
# dirty 状態や ahead/behind は git status / lazygit で見る。
[git_status]
disabled = true

# 言語バージョン検出は全部 OFF（必要なら個別に true 化）
[nodejs]
disabled = true
[python]
disabled = true
[rust]
disabled = true
[ruby]
disabled = true
[golang]
disabled = true
[java]
disabled = true
[package]
disabled = true
[docker_context]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[kubernetes]
disabled = true

[nix_shell]
format = " [($name)](blue)"
