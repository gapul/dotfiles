# 外観
osc=no
border=no
keepaspect-window=no
# Rosé Pine dark/light の切替は scripts/theme-follow.lua が macOS 外観を監視して行う。
background-color="#191724"

# OSD
osd-font="SF Pro Display"
osd-font-size=32
osd-color="#e0def4"
osd-border-color="#191724"
osd-border-size=2
osd-bar-align-y=0.95
osd-bar-h=2
osd-bar-w=90

# 音声ファイル表示
force-window=yes
geometry=400x400

# 動画
hwdec=auto
vo=gpu

# スクリーンショット
screenshot-directory=~/Pictures
screenshot-format=png
