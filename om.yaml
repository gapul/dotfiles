# omnix CI 設定 — https://omnix.page/om/ci.html
#
# これが「gh 非依存な CI の単一の真実」。ビルド対象は flake 出力から omnix が
# 自動収集する:
#   - packages / checks / devShells
#   - darwinConfigurations.* / nixosConfigurations.*
#   - legacyPackages.<system>.homeConfigurations.*  (flake.nix で別名公開済み)
# pure な nix build にできない追加チェックだけを custom step として宣言する。
#
# 実行はどの CI でも共通:  om ci run --systems <system>
# ローカルでも  `om ci`  で CI と同一のビルド/チェックを再現できる。
ci:
  # system 別ジョブ (.github/workflows/ci.yml の matrix)。flake 出力のビルドが主で、
  # custom step は「その system でしか回せないもの」だけを置く。
  default:
    root:
      dir: nix
      steps:
        custom:
          nix-on-droid:
            type: app
            name: ci-nixondroid
            systems:
              - aarch64-linux

  # リポジトリ全体のリンタ・秘密検出・生成物ドリフト。system に依らないので、どの
  # ビルドジョブにも混ぜず専用ジョブ (ci.yml の checks) から `om ci run .#checks` で回す。
  # 既存ジョブに相乗りさせると、そのジョブがそのまま CI 全体の長い棒になる。
  # ビルドは default 側が済ませているのでここでは止める。
  checks:
    root:
      dir: nix
      steps:
        build:
          enable: false
        flake-check:
          enable: false
        custom:
          lint:
            type: devshell
            command:
              - bash
              - -c
              - cd "$(git rev-parse --show-toplevel)" && ./scripts/ci-lint.sh
            systems:
              - x86_64-linux

          gitleaks:
            type: devshell
            command:
              - bash
              - -c
              - cd "$(git rev-parse --show-toplevel)" && ./scripts/ci-gitleaks.sh
            systems:
              - x86_64-linux

          generated-drift:
            type: devshell
            command:
              - bash
              - -c
              - cd "$(git rev-parse --show-toplevel)" && ./scripts/check-generated.sh
            systems:
              - x86_64-linux
