# omnix CI 設定 — https://omnix.page/om/ci.html
#
# これが「gh 非依存な CI の単一の真実」。ビルド対象は flake 出力から omnix が
# 自動収集する:
#   - packages / checks / devShells
#   - darwinConfigurations.* / nixosConfigurations.*
#   - legacyPackages.<system>.homeConfigurations.*  (flake.nix で別名公開済み)
# pure な nix build にできない追加チェックだけを custom step として宣言する。
#
# 実行はどの CI でも共通:  om ci run --systems <system>
# ローカルでも  `om ci`  で CI と同一のビルド/チェックを再現できる。
ci:
  default:
    root:
      dir: nix
      steps:
        custom:
          # 非 nix-build なリンタ群 (just/statix/shellcheck/stylua/taplo/jq/yq/actionlint)。
          # devShell の PATH でまとめて実行。1 system だけで十分なので、いちばん余裕のある
          # Linux ジョブに寄せる (darwin ジョブは system closure の取得で 7 分近く使うため)。
          lint:
            type: devshell
            command:
              - bash
              - -c
              - cd "$(git rev-parse --show-toplevel)" && ./scripts/ci-lint.sh
            systems:
              - x86_64-linux

          # 全コミット履歴の gitleaks detect (pre-commit の protect を二重化)。
          gitleaks:
            type: devshell
            command:
              - bash
              - -c
              - cd "$(git rev-parse --show-toplevel)" && ./scripts/ci-gitleaks.sh
            systems:
              - x86_64-linux

          # 生成物ドリフト検査 (Karabiner / Skill / lazy2nix / lazygit schema)。
          generated-drift:
            type: devshell
            command:
              - bash
              - -c
              - cd "$(git rev-parse --show-toplevel)" && ./scripts/check-generated.sh
            systems:
              - x86_64-linux

          # nix-on-droid は omnix 標準対象外 + --impure が要るため専用 app に逃がす。
          nix-on-droid:
            type: app
            name: ci-nixondroid
            systems:
              - aarch64-linux
