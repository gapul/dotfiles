name: Set up Nix
description: Install Nix (Determinate)

# ビルドキャッシュ履歴 (すべて検証の上で不採用。CI は無キャッシュで確定):
#  - nix-community/cache-nix-action: Determinate installer と tar 衝突で無効。
#  - Magic Nix Cache: GitHub Actions Cache backend が大きい closure で throttle され
#    ("GitHub Actions Cache throttled Magic Nix Cache") 実質機能せず。Determinate も非推奨化。
#  - FlakeHub Cache: 有料プラン専用。無料では "cache is not enabled" で何もしない。
#  - 自前 attic を CI substituter: narinfo ミスで実測 +4分の純増。
# よって GitHub ホスト runner では毎回フルビルド。Nix 導入だけ行う。

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
