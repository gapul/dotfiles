name: Set up Nix
description: Install Nix (Determinate)

# 注記: 以前は nix-community/cache-nix-action で GitHub Actions の nix store を
# キャッシュしていたが、Determinate nix-installer が /nix/store を先に書き込むため
# tar 復元が "Cannot mkdir" で全滅し、実質ゼロ復元 + 840MB の無駄 DL になっていた。
# ビルドキャッシュは自前 attic (cache.gapul.net) に一本化した (ci.yml で substituter
# 追加 + watch-store push)。詳細は memory homelab-attic-cache 参照。

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
