name: Set up Nix
description: Install Nix (Determinate) と cachix 共有キャッシュを有効化

# ビルドキャッシュ = cachix (cachix.org, OSS は無料枠)。OSS Nix の定番手段。
# ここに至るまでの不採用履歴:
#  - cache-nix-action : Determinate の tar と衝突し復元不能 (mkdir エラー)。
#  - Magic Nix Cache  : macos-14 でハング / Linux で GHA Cache に throttle・非推奨化。
#  - FlakeHub Cache   : 有料プラン専用 (無料では "cache is not enabled" で何もしない)。
#  - 自前 attic を CI substituter : narinfo ミスで実測 +4分の純増。
# cachix は Determinate インストーラと共存でき、pull は token 不要 (fork PR も読める)、
# push は CACHIX_AUTH_TOKEN がある時だけ走る (owner の push / main / cold-build)。
# cache 名はハードコード (public 名は秘密でない)。以前 vars.CACHIX_CACHE_NAME を
# 消して 403 で沈黙した罠を避けるため、あえて変数化しない。

inputs:
  cachix-token:
    description: cachix write token。空なら pull (substituter) のみで push しない。
    default: ''
  cachix:
    description: cachix を有効化するか。cold-build は 'false' で完全 cold ビルドにする。
    default: 'true'
  mocopi-deploy-key:
    description: |
      private な flake input (gapul/mocopi-mac) を読むための read-only deploy key。
      空なら何もしない — fork PR は secret を受け取れないため。
    default: ''

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    # flake input の1つ (mocopi-mac) が private repo なので、nix が git+ssh で取りに行ける
    # ように read-only の deploy key を置く。Install Nix の直後に置くのは、この後の
    # 「Cache flake inputs」より前に鍵が要るため。
    - name: private flake input 用の SSH 鍵
      if: inputs.mocopi-deploy-key != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ inputs.mocopi-deploy-key }}" > ~/.ssh/mocopi_ci
        chmod 600 ~/.ssh/mocopi_ci
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        cat >> ~/.ssh/config <<'EOF'
        Host github.com
          IdentityFile ~/.ssh/mocopi_ci
          IdentitiesOnly yes
        EOF

    # Flake inputs are fetched from GitHub into ~/.cache/nix on every cold runner, which in a
    # measured darwin run cost around two minutes spread over "into the Git cache..." pauses.
    # The lock pins them, so the cache key is the lock: a hit means zero input fetching.
    - name: Cache flake inputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/nix
        key: nix-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock') }}
        restore-keys: |
          nix-inputs-${{ runner.os }}-${{ runner.arch }}-

    # pull: 常時 (cachix use gapul-dotfiles を substituter に追加)。
    # push: authToken がある時だけ (fork PR は secret が無いので自動的に pull のみ)。
    # cachix: 'false' の時は pull も push もしない (cold-build 用)。
    - name: Enable cachix (gapul-dotfiles)
      if: inputs.cachix == 'true'
      uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
      with:
        name: gapul-dotfiles
        authToken: ${{ inputs.cachix-token }}
