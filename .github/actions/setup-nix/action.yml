name: Set up Nix
description: Install Nix (Determinate)

# ビルドキャッシュ履歴:
#  - nix-community/cache-nix-action: Determinate installer と tar 衝突で無効 (撤去)。
#  - Magic Nix Cache: GitHub Actions Cache backend が大きい closure で throttle され
#    ("GitHub Actions Cache throttled Magic Nix Cache") 実質機能せず (撤去)。
# 現行はキャッシュを FlakeHub Cache (hosted, GHA throttle 非対象) に一本化し、
# 各ワークフロー側 (ci.yml) で flakehub-cache-action を呼ぶ。cold-build は無キャッシュ。

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
