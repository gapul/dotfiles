name: Set up Nix
description: Install Nix and enable the shared GitHub/Cachix build caches

inputs:
  use-github-cache:
    description: Restore and save the GitHub Actions Nix store cache
    default: 'true'
  cachix-name:
    description: Optional Cachix cache name
    default: ''
  cachix-token:
    description: Optional Cachix write token
    default: ''

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    - name: Cache Nix store in GitHub Actions
      if: inputs.use-github-cache == 'true'
      uses: nix-community/cache-nix-action@d8cff2f74b9341e0d90fbf3c0c0212a161ceaef6 # v6
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-macos: 6G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
        purge-created: 0
        purge-last-accessed: 0
        purge-primary-key: never

    - name: Enable optional Cachix
      if: inputs.cachix-name != ''
      uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
      with:
        name: ${{ inputs.cachix-name }}
        authToken: ${{ inputs.cachix-token }}
