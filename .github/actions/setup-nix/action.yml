name: Set up Nix
description: Install Nix (Determinate) と cachix 共有キャッシュを有効化

# ビルドキャッシュ = cachix (cachix.org, OSS は無料枠)。OSS Nix の定番手段。
# ここに至るまでの不採用履歴:
#  - cache-nix-action : Determinate の tar と衝突し復元不能 (mkdir エラー)。
#  - Magic Nix Cache  : macos-14 でハング / Linux で GHA Cache に throttle・非推奨化。
#  - FlakeHub Cache   : 有料プラン専用 (無料では "cache is not enabled" で何もしない)。
#  - 自前 attic を CI substituter : narinfo ミスで実測 +4分の純増。
# cachix は Determinate インストーラと共存でき、pull は token 不要 (fork PR も読める)、
# push は CACHIX_AUTH_TOKEN がある時だけ走る (owner の push / main / cold-build)。
# cache 名はハードコード (public 名は秘密でない)。以前 vars.CACHIX_CACHE_NAME を
# 消して 403 で沈黙した罠を避けるため、あえて変数化しない。

inputs:
  cachix-token:
    description: cachix write token。空なら pull (substituter) のみで push しない。
    default: ''
  cachix:
    description: cachix を有効化するか。cold-build は 'false' で完全 cold ビルドにする。
    default: 'true'
  mocopi-deploy-key:
    description: |
      private な flake input (gapul/mocopi-mac) を読むための read-only deploy key。
      空なら何もしない — fork PR は secret を受け取れないため。
    default: ''

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    # flake input の1つ (mocopi-mac) が private repo なので、nix が git+ssh で取りに行ける
    # ように read-only の deploy key を置く。Install Nix の直後に置くのは、この後の
    # 「Cache flake inputs」より前に鍵が要るため。
    - name: private flake input 用の SSH 鍵
      if: inputs.mocopi-deploy-key != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ inputs.mocopi-deploy-key }}" > ~/.ssh/mocopi_ci
        chmod 600 ~/.ssh/mocopi_ci
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        cat >> ~/.ssh/config <<'EOF'
        Host github.com
          IdentityFile ~/.ssh/mocopi_ci
          IdentitiesOnly yes
        EOF

    # Flake inputs are fetched from GitHub into ~/.cache/nix on every cold runner, which in a
    # measured darwin run cost around two minutes spread over "into the Git cache..." pauses.
    # The lock pins them, so the cache key is the lock: a hit means zero input fetching.
    - name: Cache flake inputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/nix
        key: nix-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock') }}
        restore-keys: |
          nix-inputs-${{ runner.os }}-${{ runner.arch }}-

    # pull: 常時 (cachix use gapul-dotfiles を substituter に追加)。
    # push: authToken がある時だけ (fork PR は secret が無いので自動的に pull のみ)。
    # cachix: 'false' の時は pull も push もしない (cold-build 用)。
    # cachix-action の既定は nix-env で入れて PATH 上の cachix を which で探す。自前ランナー
    # (macmini) ではどちらも成り立たない: ユーザープロファイルが home-manager の作る新形式
    # なので nix-env が "incompatible with 'nix-env'" で止まり、nix profile で入れ直しても
    # その profile の bin は PATH に無いので `Error: not found: cachix` になる。hosted runner
    # は ~/.nix-profile が PATH に載っているので踏まない。
    #
    # 先に入れて PATH を通しておき、action 側の導入は no-op にする。GITHUB_PATH は次の
    # ステップから効くので、同じステップ内で which させるこの action には前段が要る。
    - name: Install cachix
      id: cachix-setup
      if: inputs.cachix == 'true'
      shell: bash
      env:
        # トークンそのものは渡さない。有無だけ分かればいい。
        HAS_TOKEN: ${{ inputs.cachix-token != '' }}
      run: |
        # homeserver は substituter を root 所有の行で宣言してある (hosts/homeserver.nix)。
        # そこで `cachix use` を呼ぶと "This user doesn't have permissions to configure
        # binary caches" で落ちる — サービスユーザーは trusted-user ではないし、
        # trusted-user は root 相当なので入れたくない (macmini-ci-runner.nix の判断)。
        # 既に substituter として効いているなら、pull のために設定する必要はない。
        if nix config show substituters 2>/dev/null | grep -q gapul-dotfiles; then
          echo "preconfigured=true" >>"$GITHUB_OUTPUT"
          # pull だけなら、この先で入れる cachix を誰も使わない。
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "cachix: substituter は宣言済み、push も無いので何もしない"
            exit 0
          fi
        fi
        # Already declared on the self-hosted runner, so there is nothing to do there — which is
        # the point: installing it every run cost more than the build it was setting up for
        # (56s of setup against 18s of nix build, measured 2026-09-10).
        if command -v cachix >/dev/null 2>&1; then
          echo "cachix: $(command -v cachix)"
          exit 0
        fi
        nix profile add nixpkgs#cachix
        echo "$HOME/.local/state/nix/profiles/profile/bin" >>"$GITHUB_PATH"

        # `cachix use` edits the user nix.conf and stops if the file is not there
        # ("openFile: does not exist"). The Determinate installer only writes /etc/nix/nix.conf,
        # so on a fresh runner there is nothing to edit.
        mkdir -p "$HOME/.config/nix"
        touch "$HOME/.config/nix/nix.conf"

    # push が要るとき (authToken あり) は必ず通す。pull だけなら、substituter が既に
    # 宣言済みの機械では何もすることがないので飛ばす。
    - name: Enable cachix (gapul-dotfiles)
      if: inputs.cachix == 'true' && (inputs.cachix-token != '' || steps.cachix-setup.outputs.preconfigured != 'true')
      uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
      with:
        name: gapul-dotfiles
        authToken: ${{ inputs.cachix-token }}
        # 上のステップで入れて PATH も通してあるので、ここでは何もしない。
        installCommand: "true"
