name: Update flake.lock

# flake.lock を週次で更新する PR を自動作成。
# 古い lock のまま既知脆弱性パッケージが残るのを防ぐ。
on:
  schedule:
    # 毎時。週 1 だった理由は「寝かせる時間が防御になる」だったが、それが効くのは
    # xz のような発覚前の期間だけで、公表された脆弱性には速く直す方が有利。安定枝を
    # やめた以上、ここで待つ理由も無い。
    #
    # nixos-unstable は Hydra が通ってから進むので、実際に動くのは数日おき。毎時に
    # しても回数はさほど増えず、遅れの上限だけが 7 日から 1 時間になる。差分が無い
    # 回は PR も作られないので CI も走らない。
    - cron: '0 * * * *'
  workflow_dispatch: # 手動 trigger 用

permissions:
  contents: write
  pull-requests: write

# PR を作るトークン。GITHUB_TOKEN (github-actions[bot]) が作った PR は、2026-06-11 の GitHub の
# 仕様変更で必ず「maintainer の承認待ち」になり (承認ポリシーを最も緩くしても変わらない、
# 実測 2026-09-23)、必須チェックが来ないので auto-merge が永遠に待つ。人の PAT で作れば
# 作者が人になり、普通の PR と同じに CI が走る。secret が無ければ GITHUB_TOKEN に落ちる
# (壊れはしないが、その PR は手で「Approve and run」が要る)。
#   fine-grained PAT: gapul/dotfiles のみ, Contents: RW, Pull requests: RW, Workflows: RW
#   gh secret set AUTOMATION_PR_TOKEN
env:
  PR_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}

jobs:
  update-lock:
    name: nix flake update -> PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 素の nix-installer ではなく setup-nix なのは、flake input の1つ (mocopi-mac) が
      # private で、deploy key が無いと `nix flake update` 自体が fetch で落ちるため
      # (2026-09-21〜22 に毎時失敗していた)。ビルドはしないので cachix は要らない。
      - uses: ./.github/actions/setup-nix
        with:
          cachix: 'false'
          mocopi-deploy-key: ${{ secrets.MOCOPI_DEPLOY_KEY }}
      - name: Update flake.lock and open PR
        id: lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ env.PR_TOKEN }}
          path-to-flake-dir: nix
          pr-title: 'chore(nix): update flake.lock'
          pr-labels: |
            dependencies
            automated
          commit-msg: 'chore(nix): update flake.lock'
      # 人が見て判断する余地の無い更新なので、CI が緑になった時点で入れる。
      # main は om ci を必須にしているので、auto-merge は実質「CI 緑まで待つ」の意味。
      #
      # この PR の作者は github-actions[bot]。リポジトリの Actions 設定 (fork PR の承認ポリシー)
      # が「外部コントリビュータ全員に承認を要求」だと bot も外部扱いになり、pull_request の
      # run が action_required で止まって必須チェックが永遠に来ない (#601 が 11 日 BLOCKED)。
      # 既定の「初回コントリビュータのみ」に戻してある (2026-09-22)。workflow_dispatch で CI を
      # 起こす案は、その check が PR に紐づかず必須チェックを満たさないので使えない。
      - name: Enable auto-merge
        if: steps.lock.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.lock.outputs.pull-request-number }}"

  update-custom-packages:
    name: update custom packages -> PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Update versions and hashes
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
        run: ./scripts/update-custom-packages.sh
      - name: Open dependency PR
        id: pkgs
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ env.PR_TOKEN }}
          branch: automation/custom-packages
          delete-branch: true
          title: 'chore(nix): update custom packages'
          commit-message: 'chore(nix): update custom packages'
          labels: |
            dependencies
            automated
          body: 'Automated version and hash refresh for slk, Unity CLI, and the Fabric server jar and mods.'
      - name: Enable auto-merge
        if: steps.pkgs.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pkgs.outputs.pull-request-number }}"
