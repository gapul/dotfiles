name: CI

# gh 非依存な CI 本体。ビルド対象/チェックはすべて om.yaml + flake 出力に宣言し、
# ここは「Nix を入れて om ci を回すだけ」の薄いプロバイダアダプタに留める。
# 同じ `om ci run` は Forgejo / GitLab / ローカルでもそのまま使える。
on:
  push:
    branches: [main]
    paths:
      - 'nix/**'
      - 'configs/**'
      - 'secrets/**'
      - 'scripts/**'
      - 'docs/NIXOS_*.md'
      - 'Justfile'
      - '.statix.toml'
      - '.gitleaks.toml'
      - 'om.yaml'
      - '.github/actions/setup-nix/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'nix/**'
      - 'configs/**'
      - 'secrets/**'
      - 'scripts/**'
      - 'docs/NIXOS_*.md'
      - 'Justfile'
      - '.statix.toml'
      - '.gitleaks.toml'
      - 'om.yaml'
      - '.github/actions/setup-nix/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# FlakeHub Cache の OIDC 認証に id-token: write が要る。
permissions:
  contents: read
  id-token: write

jobs:
  om-ci:
    name: om ci (${{ matrix.system }})
    strategy:
      # 1 system が落ちたら残りを即キャンセルして無駄な CI 時間/課金を抑える。
      # 全 system の失敗を一度に見たいときは workflow_dispatch で cold-build を回す。
      fail-fast: true
      # system -> runner の対応だけがプロバイダ固有。omnix が各 system の全出力
      # (packages/checks/darwin+nixos configs/home activationPackage) と、
      # om.yaml の custom step (lint/gitleaks/generated-drift/nix-on-droid) を回す。
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks detect が全履歴を走査するため必須

      - uses: ./.github/actions/setup-nix

      # ビルドキャッシュ = FlakeHub Cache (hosted。GHA Cache backend の Magic Nix
      # Cache は大きい closure で throttle され機能しなかったため置換)。
      # run 間キャッシュ。continue-on-error なので FlakeHub 未連携/失敗でも CI は緑。
      #
      # macOS(macos-14) 限定除外: Determinate のキャッシュデーモン (magic-nix-cache /
      # flakehub-cache 双方) は macos-14 ランナーで setup が返らずハングし、
      # continue-on-error でも救えず 90分 timeout まで job が詰まる (実測 35分+)。
      # よって Linux(x86/arm) のみで有効化。長時間側は x86 なので高速化目的は達成し、
      # darwin はキャッシュ無し (~15分。もともと律速ではない) で据え置く。
      # (attic は各実機の substituter として dev 機共有専用に残す。)
      - name: FlakeHub Cache
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: DeterminateSystems/flakehub-cache-action@77c6bddd7d747943530aaa578c57f233ee5d920e # v3

      # omnix 本体は om.cachix.org から取得 (--accept-flake-config)。ソースビルドしない。
      - name: om ci run
        run: |
          nix --accept-flake-config run github:juspay/omnix/v1.3.2 -- \
            ci run \
            --systems "${{ matrix.system }}" \
            --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} \
            -- --accept-flake-config
