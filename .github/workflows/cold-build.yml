name: Cold reproducibility build

# GitHub/Cachix キャッシュを一切復元せず om ci を回し、全出力がソースから
# 再現ビルドできるかを週次で確認する。対象リストは om.yaml + flake が単一の真実。
on:
  schedule:
    # 毎週土曜 03:00 JST = 前日 18:00 UTC
    - cron: '0 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-build:
    name: Cold om ci (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks detect が全履歴を走査するため必須
      # Magic Nix Cache を無効化し、attic substituter も足さないので、この job は
      # 正真正銘キャッシュ無しのソース再現ビルドになる (週次で全出力の再現性を検証)。
      - uses: ./.github/actions/setup-nix
        with:
          use-magic-nix-cache: 'false'
      - name: om ci run (no restored cache)
        run: |
          nix --accept-flake-config run github:juspay/omnix/v1.3.2 -- \
            ci run \
            --systems "${{ matrix.system }}" \
            --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} \
            -- --accept-flake-config
