name: Cold reproducibility build

# GitHub/Cachix キャッシュを一切復元せず om ci を回し、全出力がソースから
# 再現ビルドできるかを週次で確認する。対象リストは om.yaml + flake が単一の真実。
on:
  schedule:
    # 毎週土曜 03:00 JST = 前日 18:00 UTC
    - cron: '0 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-build:
    name: Cold om ci (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks detect が全履歴を走査するため必須
      # この job の目的は全出力のソース再現性検証。cachix を有効にすると pull で
      # 復元してしまい cold にならないため無効化 (push もしない。充填は ci.yml が担う)。
      - uses: ./.github/actions/setup-nix
        with:
          cachix: 'false'
      - name: om ci run (no restored cache)
        run: |
          nix --accept-flake-config run github:juspay/omnix/v1.3.2 -- \
            ci run \
            --systems "${{ matrix.system }}" \
            --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} \
            -- --accept-flake-config
