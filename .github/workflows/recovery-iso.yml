name: Recovery ISO

# ISO のビルド自体は om ci (packages.x86_64-linux.recovery-iso) が検証する。
# ここは GitHub 固有の副作用 — artifact アップロードと provenance attestation —
# だけを担うアダプタ。他プロバイダへ移す際はこのファイルごと差し替える。
on:
  push:
    branches: [main]
    paths:
      - 'nix/**'
      - 'configs/**'
      - 'secrets/**'
      - 'scripts/**'
      - '.github/actions/setup-nix/**'
      - '.github/workflows/recovery-iso.yml'
  pull_request:
    paths:
      - 'nix/**'
      - 'configs/**'
      - 'secrets/**'
      - 'scripts/**'
      - '.github/actions/setup-nix/**'
      - '.github/workflows/recovery-iso.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHIX_NAME: ${{ vars.CACHIX_CACHE_NAME }}

jobs:
  recovery-iso:
    name: Recovery ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-nix
        with:
          cachix-name: ${{ env.CACHIX_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build recovery image
        run: nix build ./nix#recovery-iso --out-link result --show-trace
      - name: Stage image and record checksum
        # result/ は読み取り専用の nix store symlink なのでそこには書けない。
        # 書き込み可能な iso-out/ に取り出してから SHA256SUMS を生成する。
        run: |
          mkdir -p iso-out
          cp --no-preserve=mode ./result/iso/*.iso iso-out/
          ( cd iso-out && sha256sum ./*.iso | tee SHA256SUMS )
      - name: Upload recovery image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nixos-recovery-${{ github.sha }}
          path: iso-out/
          retention-days: 90
          if-no-files-found: error
      - name: Attest recovery image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: iso-out/*.iso
