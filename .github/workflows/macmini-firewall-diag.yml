name: macmini firewall diag
# One-off: macmini stopped answering every inbound connection on 2026-09-27 and the self-hosted
# runner is the only way in. Runs an arbitrary script as root on the box. Remove once recovered.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "bash script to run on macmini with sudo -n"
        type: string
        required: true
jobs:
  run:
    runs-on: [self-hosted, macmini]
    timeout-minutes: 10
    steps:
      - name: Run
        env:
          SCRIPT: ${{ inputs.script }}
        run: printf '%s\n' "$SCRIPT" > /tmp/macmini-diag.sh && sudo -n /bin/bash -x /tmp/macmini-diag.sh 2>&1 | tail -400
